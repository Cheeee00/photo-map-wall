function exifTypeSize(t) {
  return (t === 1 || t === 2 || t === 6 || t === 7) ? 1 :
         (t === 3 || t === 8) ? 2 :
         (t === 4 || t === 9 || t === 11) ? 4 :
         (t === 5 || t === 10 || t === 12) ? 8 : 1;
}
function parseExifGps(buf) {
  try {
    const dv = new DataView(buf);
    if (dv.byteLength < 12 || dv.getUint16(0) !== 0xFFD8) return null;
    let off = 2, tiff = -1;
    while (off + 4 <= dv.byteLength) {
      if (dv.getUint8(off) !== 0xFF) { off++; continue; }
      const marker = dv.getUint8(off + 1);
      if (marker === 0x00) { off++; continue; }
      if (marker === 0xD8 || (marker >= 0xD0 && marker <= 0xD7) || marker === 0x01) { off += 2; continue; }
      if (marker === 0xDA || off + 4 > dv.byteLength) break;      // SOS：EXIF 必在其前
      const len = dv.getUint16(off + 2);
      if (marker === 0xE1 && off + 10 <= dv.byteLength &&
          dv.getUint32(off + 4) === 0x45786966 && dv.getUint16(off + 8) === 0) { tiff = off + 10; break; }
      off += 2 + len;
    }
    if (tiff < 0 || tiff + 8 > dv.byteLength) return null;
    const le = dv.getUint16(tiff) === 0x4949;
    const u16 = function (o) { return dv.getUint16(o, le); };
    const u32 = function (o) { return dv.getUint32(o, le); };
    if (u16(tiff + 2) !== 0x2A) return null;
    const ifd0 = tiff + u32(tiff + 4);
    if (ifd0 + 2 > dv.byteLength) return null;
    const n0 = u16(ifd0);
    let gpsOff = 0;
    for (let i = 0; i < n0; i++) {
      const e = ifd0 + 2 + i * 12;
      if (e + 12 > dv.byteLength) return null;
      if (u16(e) === 0x8825) { gpsOff = tiff + u32(e + 8); break; }
    }
    if (!gpsOff || gpsOff + 2 > dv.byteLength) return null;
    const ng = u16(gpsOff);
    let latRef = 78, lonRef = 69, lat = null, lon = null;   // 'N' / 'E'
    const rat = function (o) { const n = u32(o), d = u32(o + 4); return d ? n / d : 0; };
    for (let i = 0; i < ng; i++) {
      const e = gpsOff + 2 + i * 12;
      if (e + 12 > dv.byteLength) break;
      const tag = u16(e), typ = u16(e + 2), cnt = u32(e + 4);
      const vo = cnt * exifTypeSize(typ) > 4 ? tiff + u32(e + 8) : e + 8;
      if (vo + 8 > dv.byteLength) continue;
      if (tag === 1 && typ === 2) latRef = dv.getUint8(vo);
      else if (tag === 3 && typ === 2) lonRef = dv.getUint8(vo);
      else if (tag === 2 && typ === 5 && cnt >= 3) lat = rat(vo) + rat(vo + 8) / 60 + rat(vo + 16) / 3600;
      else if (tag === 4 && typ === 5 && cnt >= 3) lon = rat(vo) + rat(vo + 8) / 60 + rat(vo + 16) / 3600;
    }
    if (lat === null || lon === null || !isFinite(lat) || !isFinite(lon)) return null;
    if (latRef === 83) lat = -lat;        // 'S'
    if (lonRef === 87) lon = -lon;        // 'W'
    if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    return { lat: lat, lon: lon };
  } catch (e) { return null; }
}

/* GPS → 地点标签：120km 内取最近城市，否则取所在省，最后兜底最近城市 */
function nearestCity(lon, lat) {
  let best = null, bd = Infinity;
  for (let i = 0; i < CITIES.length; i++) {
    const c = CITIES[i];
    const dx = (c[1] - lon) * 111 * Math.cos((c[2] + lat) / 2 * D2R);
    const dy = (c[2] - lat) * 111;
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = { name: c[0], km: Math.sqrt(d2) }; }
  }
  return best;
}
/* 国外照片的落点：先用全球城市表，找不到再退到国家名。
   距离给到 90km —— 大部分人拍照就在城里或城郊，落「国家」太粗，落错城市比落国家更糟。 */
function nearestCityW(lon, lat) {
  let best = null, bd = Infinity;
  for (let i = 0; i < CITIES_W.length; i++) {
    const c = CITIES_W[i];
    const dy = (c[3] - lat) * 111;
    const dx = (c[2] - lon) * 111 * Math.cos((c[3] + lat) / 2 * D2R);
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = { name: c[0], country: c[1], km: Math.sqrt(d2) }; }
  }
  return best;
}
/* 国家名 → 大洲（WORLD 里每个国家带 k 字段，构建时由 CONTINENT 翻译好） */
function continentOf(country) {
  for (let i = 0; i < WORLD.length; i++) if (WORLD[i].n === country) return WORLD[i].k || '';
  return '';
}

function pipRing(ring, x, y) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function provinceOf(lon, lat) {
  for (let i = 0; i < PROVINCES.length; i++) {
    const polys = PROVINCES[i].polys;
    for (let a = 0; a < polys.length; a++) {
      let hit = false;
      for (let b = 0; b < polys[a].length; b++) if (pipRing(polys[a][b], lon, lat)) hit = !hit;
      if (hit) return PROVINCES[i].name;
    }
  }
  return null;
}
function shortProv(name) {
  return name.replace('维吾尔自治区', '').replace('回族自治区', '').replace('壮族自治区', '')
             .replace('特别行政区', '').replace('自治区', '').replace('省', '').replace('市', '');
}
function locateLabel(lon, lat) {
  // 先判国界：出国的照片不能落到「最近的中国城市」上（那是明显错的）
  if (!inChina(lon, lat)) {
    const wc = nearestCityW(lon, lat);
    const cn = countryOf(lon, lat);
    if (wc && wc.km <= 90) return wc.name;
    if (cn && cn !== '中国') return cn;
    if (wc) return wc.name;
  }
  const nc = nearestCity(lon, lat);
  if (nc && nc.km <= 120) return nc.name;
  const pv = provinceOf(lon, lat);
  if (pv) return shortProv(pv);
  return nc ? nc.name : '未知地点';
}

async function addFiles(files) {
  const all = Array.prototype.slice.call(files);
  const arr = all.filter(function (f) { return /^image\//.test(f.type); });
  const notImage = all.length - arr.length;
  if (!arr.length) {
    showHint(notImage ? ('这 ' + notImage + ' 个文件不是照片，没能加进来。') : '没有可用的照片。');
    return;
  }
  // 首次上传时把示例换成真实照片
  const wasDemo = photos.length > 0 && photos.every(function (p) { return p.demo; });
  const isFirst = photos.length === 0 || wasDemo;
  if (wasDemo) photos = [];

  // 上限 40 张：说清楚为什么没全加进来，而不是默默只加一部分
  const room = Math.max(0, 40 - photos.length);
  const take = arr.slice(0, room);
  const over = arr.length - take.length;

  let bad = 0, badHeic = 0, noGps = 0, heicFixed = 0;
  let sawOutside = false;      // 有照片落在国外 → 中国档下自动切「全球」
  const syncList = [];         // 待上传到「同一面墙」的照片
  const btnAdd = document.getElementById('btnAdd');
  if (btnAdd) btnAdd.setAttribute('aria-busy', 'true');

  for (let i = 0; i < take.length; i++) {
    // 一次加十几张时要有进度：什么都不显示，用户会以为按钮没反应
    if (take.length > 2 && i < take.length - 1) {
      showHint('正在读取 ' + (i + 1) + ' / ' + take.length + ' 张…', 120000);
    }
    let url = await readAsDataURL(take[i]);
    let sz = await loadSize(url);
    if (sz.w < 8) {
      /* 浏览器解不了：绝大多数是 iPhone 的 HEIC。Safari 自己能解 HEIF，
         就地在本地转成 JPEG 继续用（用户无感）；Chrome/Firefox 解不了才计数。 */
      const isHeic = await isHeicFile(take[i]);
      const conv = isHeic ? await heicToJpeg(take[i]) : null;
      if (conv) { url = conv.url; sz = { w: conv.w, h: conv.h }; heicFixed++; }
      else { bad++; if (isHeic) badHeic++; continue; }
    }
    const p = makePhoto(CITIES[0][0]);
    p.url = url; p.w = sz.w; p.h = sz.h;
    p._file = take[i];
    p._name = take[i].name || '';
    p._bytes = take[i].size || 0;
    // 优先读 EXIF GPS：真实定位，不编地名
    let gps = null;
    try { gps = parseExifGps(await take[i].arrayBuffer()); } catch (e) { gps = null; }
    if (gps) {
      // 存真实经纬度（不裁到国内，否则出国的照片会全挤到国境线上）
      p.lon = gps.lon; p.lat = gps.lat;
      if (!inChina(p.lon, p.lat)) sawOutside = true;
      p.city = locateLabel(p.lon, p.lat);
      p.cc = countryOf(p.lon, p.lat) || '';   // 国家单独存：标签可能是城市名，粒度取景要国家
      p.gps = true;
      p.locked = true;
    } else {
      // 没有 GPS：轮流落到常用城市上。这个位置是猜的，界面上必须标出来（见渲染里的「待确认」）
      p.city = nextCity();
      const c = CITY_INDEX[p.city];
      p.lon = c.lon; p.lat = c.lat;
      p.cc = '中国';
      noGps++;
    }
    photos.push(p);
    savePhotoRec(p, take[i]);          // 存本地：刷新不丢
    syncList.push(p);                  // 再排队传云端
    if (photos.length >= 40) break;
  }
  if (btnAdd) btnAdd.removeAttribute('aria-busy');

  // 有国外照片却还停在中国档：先切到全球，否则这些针会被裁到国境线上
  if (sawOutside && scope !== 'world') setScope('world', false);
  // 首次上传：自动全览到他上传的这些地方。
  // 之后再上传：**不动视角**（用户正看着某处，替他把画面挪走是打扰），
  // 只让「适应全部」按钮闪一下，提示「视野外有新照片，想看全就点我」。
  if (isFirst || sawOutside) {
    btnFit.classList.remove('hasnew');
    fitToPins(true);   // 内部会先按终态视图重排，再补间过去
  } else {
    renderPhotos();
    btnFit.classList.add('hasnew');
  }
  syncGranState();

  // 后台静默传云端：失败不打扰，面板里会有状态
  if (syncList.length) syncQueuePhotos(syncList);

  // 结尾只说最要紧的那一句（HEIC 比「位置待确认」更影响结果，优先说它）
  const parts = [];
  if (badHeic) {
    // HEIC 是 iPhone 默认格式；Safari 能就地转码（已在上面转掉），Chrome / 微信内置浏览器不行。
    // 这句话直接把出路给出去，别让人以为是页面坏了。
    parts.push(badHeic + ' 张是 iPhone 的 HEIC 格式，这个浏览器解不开。三个办法任选一个：'
      + '① 用 Safari 打开本页再加；② 在手机「设置 → 相机 → 格式」选「兼容性最佳」后重拍；'
      + '③ 在相册里把这几张分享成 JPEG 再加。');
  }
  if (bad - badHeic) {
    // 不是 HEIC 却解不开：多半是文件坏了、或者是 webp/avif 之类的冷门容器
    parts.push((bad - badHeic) + ' 张图片打不开（文件可能损坏或格式不支持），换一张试试。');
  }
  if (heicFixed > 0) parts.push(heicFixed + ' 张 HEIC 已在本机转成 JPEG 加进来了。');
  if (over > 0) parts.push('一面墙最多 40 张，这次只加进来 ' + take.length + ' 张。');
  if (notImage > 0) parts.push(notImage + ' 个非图片文件已跳过。');
  if (noGps > 0) parts.push(noGps + ' 张没有拍摄定位（EXIF），位置是猜的 —— '
    + '角标写着「待确认」，点照片可以改正。');
  if (parts.length) showHint(parts.join(' '));
  else quietHint();
}

/* --------------------------------------------------- 两档选择器 --- */
/* 一档 = 地图范围：中国 / 全球。换档要重画地图件与基准视图。
   二档 = 缩放粒度：全部 / 省 / 城市。它只决定 fitPinsTarget 框多大，
          不改变墙本身。 */
const selScope = document.getElementById('selScope');
const selGran = document.getElementById('selGran');
let granMode = 'all';        // all | prov | city

selScope.addEventListener('change', function () {
  setScope(selScope.value, true);
});

/* 换地图范围：重画地图件 → 重算基准 → 回到基准视图（照片沿用） */
function setScope(v, animated) {
  const next = v === 'world' ? 'world' : 'cn';
  const changed = next !== scope;
  scope = next;
  selScope.value = next;
  buildGranOptions();       // 中国档是「省」，全球档换成「大洲 / 国家」
  if (!changed) { resetView(animated); return; }
  rebuildCanvas();          // 内部重算 baseView / 省名 / 世界标注
  resetView(animated);
}

selGran.addEventListener('change', function () {
  granMode = selGran.value;
  resetView(true);
});

/* 粒度选项跟着地图范围走：中国档是「省」，全球档是「大洲 / 国家」。
   中国的省和世界的国家都是"一级行政区"，但叫法必须对得上用户脑子里的那张图。 */
const GRAN_CN = [['all', '全部'], ['prov', '省'], ['city', '城市']];
const GRAN_WORLD = [['all', '全部'], ['cont', '大洲'], ['country', '国家'], ['city', '城市']];
function buildGranOptions() {
  const list = scope === 'world' ? GRAN_WORLD : GRAN_CN;
  const keep = granMode;
  selGran.textContent = '';
  for (let i = 0; i < list.length; i++) {
    const o = document.createElement('option');
    o.value = list[i][0];
    o.textContent = '粒度：' + list[i][1];
    selGran.appendChild(o);
  }
  const hit = list.some(function (x) { return x[0] === keep; });
  granMode = hit ? keep : 'all';
  selGran.value = granMode;
}

/* 粒度档在「只有示例照片」时没有意义：灰掉并退回「全部」 */
function syncGranState() {
  const real = photos.some(function (p) { return !p.demo; });
  selGran.disabled = !real;
  if (!real && granMode !== 'all') {
    granMode = 'all';
    selGran.value = 'all';
  }
  const names = (scope === 'world' ? GRAN_WORLD : GRAN_CN).map(function (x) { return x[1]; }).join(' / ');
  selGran.title = real ? ('缩放粒度：' + names) : '上传照片后可切换取景粒度';
}

/* 按粒度算出「要框住的 uv 范围」；返回 null 表示交给默认的打卡点外接框 */
function granBox() {
  if (!photos.length) return null;
  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  let hit = 0;
  const grow = function (a, b, c, d) {
    if (a < u0) u0 = a; if (b > u1) u1 = b;
    if (c < v0) v0 = c; if (d > v1) v1 = d;
    hit++;
  };

  if (granMode === 'cont' || granMode === 'country') {
    /* 全球档：大洲 = 该大洲所有国家的外接框并起来；国家 = 那一个国家。
       一个国家可能跨大洲（俄罗斯、土耳其），照片落哪就取哪边的国家集合，够用。 */
    const seen = {};
    for (let i = 0; i < photos.length; i++) {
      const ph = photos[i];
      const cc = ph.cc || countryOf(ph.lon, ph.lat) || '';
      const key = granMode === 'cont' ? continentOf(cc) : cc;
      if (!key || seen[key]) continue;
      seen[key] = 1;
      for (let j = 0; j < WORLD.length; j++) {
        const hitIt = granMode === 'cont' ? (WORLD[j].k === key) : (WORLD[j].n === key);
        if (!hitIt) continue;
        const b = worldBox[j];
        if (b) grow(b.u0, b.u1, b.v0, b.v1);
      }
    }
  } else if (granMode === 'prov') {
    const seen = {};
    for (let i = 0; i < photos.length; i++) {
      const nm = provinceOf(photos[i].lon, photos[i].lat);
      if (!nm || seen[nm]) continue;
      const pv = provUV.find(function (q) { return q.name === nm; });
      if (!pv) continue;
      seen[nm] = 1;
      grow(pv.b.u0, pv.b.u1, pv.b.v0, pv.b.v1);
    }
  } else if (granMode === 'city') {
    // 城市级：以打卡点为中心取 ±0.34° 的小框（约 ±38km），相当于「市区+近郊」
    const R = 0.34;
    for (let i = 0; i < photos.length; i++) {
      const a = proj(photos[i].lon - R, photos[i].lat + R);
      const b = proj(photos[i].lon + R, photos[i].lat - R);
      grow(a[0], b[0], a[1], b[1]);
    }
  } else {
    return null;
  }

  if (!hit) return null;      // 省粒度下照片都在国外等 → 退回全部
  return { u0: u0, u1: u1, v0: v0, v1: v1 };
}

/* 「看示例」= 借看一下，不是清空。

    // 进入示例：真实照片只是从屏幕上收起，本地库和云端都不动
    demoStash = photos.filter(function (p) { return !p.demo; });
    useDemo();
    if (demoStash.length) {
      btn.textContent = '回到我的墙';
      showHint('这是示例。你自己的 ' + demoStash.length + ' 张还在，点「回到我的墙」就能回来。', 6000);
    }
    return;
  }
  const back = demoStash;
  demoStash = null;
  btn.textContent = '看示例';
  photos = back;
  renderPhotos();
  resetView(true);
  syncGranState();
  if (!photos.length) showHint('这面墙空了。点「加照片」放一张进来。', 6000);
});
document.getElementById('btnExport').addEventListener('click', exportPNG);
// 触屏缩放按钮（手机上显示，桌面隐藏）

/* 拖动文件 */
let dragDepth = 0;
const dropEl = document.getElementById('drop');
window.addEventListener('dragenter', function (ev) {
  if (!ev.dataTransfer || Array.prototype.indexOf.call(ev.dataTransfer.types, 'Files') < 0) return;
  ev.preventDefault(); dragDepth++; dropEl.classList.add('on');
});
window.addEventListener('dragover', function (ev) {
  if (ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types, 'Files') >= 0) {
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
  }
});
window.addEventListener('dragleave', function () {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) dropEl.classList.remove('on');
});
window.addEventListener('drop', function (ev) {
  ev.preventDefault();
  dragDepth = 0; dropEl.classList.remove('on');
  if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) addFiles(ev.dataTransfer.files);
});

const hintEl = document.getElementById('hint');
let hintTimer = null;
let hintUndo = null;          // 提示条上的「点我撤销」回调
hintEl.addEventListener('click', function () {
  if (!hintUndo) return;
  const fn = hintUndo;
  hintUndo = null;
  fn();
});
function hideHint() {
  if (hintTimer) return;
  hintTimer = setTimeout(function () { hintEl.classList.add('gone'); hintTimer = null; }, 900);
}
/* 临时提示（解码失败、正在读取…等），默认 7 秒后自动淡出 */
function showHint(msg, hold) {
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  hintUndo = null;                            // 换了文案，旧的撤销就没意义了
  hintEl.classList.remove('undo');
  hintEl.textContent = msg;
  hintEl.style.color = '#E8B27A';
  hintEl.classList.remove('gone');
  hintTimer = setTimeout(function () { hintEl.classList.add('gone'); hintTimer = null; },
    hold == null ? 7000 : hold);
}
/* 立刻收掉提示（不要等定时器，也不要留下一条过期的话） */
function quietHint() {
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  hintUndo = null;
  hintEl.classList.remove('undo');
  hintEl.classList.add('gone');
}

/* ------------------------------------------------------------- 导出 --- */
/* 导出高度基准 1200，再乘 2 输出 —— 4K 屏上看、或者拿去打印都够清楚。
   2× 超采样只在输出本身不大时才做：2400 高的成品再乘 2 就是 4800，手机上会 OOM。 */
const EXPORT_H = 1200;
const EXPORT_SCALE = 2;
const EXPORT_MAX_PX = 3.2e7;      // 3200 万像素上限（约 7300×4400），超了等比收
const EXPORT_SS_MAX_PX = 1.4e7;   // 超过这个像素数就不再做 2× 超采样
async function exportPNG() {
  hideViewer();
  showHint('正在导出…', 60000);
  // 导出按当前画布比例，长边固定 1200 高 → 宽随画布比例
  let outH = EXPORT_H * EXPORT_SCALE;
  let outW = Math.round(outH * BW / BH);
  if (outW * outH > EXPORT_MAX_PX) {
    const k = Math.sqrt(EXPORT_MAX_PX / (outW * outH));
    outH = Math.round(outH * k);
    outW = Math.round(outW * k);
  }
  const clone = board.cloneNode(true);
  clone.setAttribute('width', outW);
  clone.setAttribute('height', outH);
  clone.setAttribute('viewBox', '0 0 ' + BW + ' ' + BH);
  clone.setAttribute('xmlns', NS);
  clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + xml],
                        { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise(function (res, rej) {
      const im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { rej(new Error('SVG 光栅化失败')); };
      im.src = url;
    });
    /* 2× 超采样：先按两倍尺寸光栅化，再缩回目标尺寸。
       SVG 里的文字和描边在浏览器里是矢量、到 2× 才足够采样密度，
       直接 1× 光栅化再放大只会更糊。 */
    const SS = (outW * outH) > EXPORT_SS_MAX_PX ? 1 : 2;
    const big = document.createElement('canvas');
    big.width = outW * SS; big.height = outH * SS;
    const bx = big.getContext('2d');
    bx.fillStyle = '#140E0A';
    bx.fillRect(0, 0, big.width, big.height);
    bx.drawImage(img, 0, 0, big.width, big.height);
    const cv = document.createElement('canvas');
    cv.width = outW; cv.height = outH;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#140E0A';
    ctx.fillRect(0, 0, outW, outH);
    ctx.drawImage(big, 0, 0, outW, outH);
    cv.toBlob(function (b) {
      if (!b) return;
      // 用本地日期，不要用 toISOString()：那是 UTC，中国用户 0-8 点导出会拿到前一天的日期
      const d = new Date();
      const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
        + '-' + String(d.getDate()).padStart(2, '0');
      const name = '照片地图墙-' + stamp + '.png';
      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      const file = new File([b], name, { type: 'image/png' });
      if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
        // iOS 没有"下载"这个概念：走系统分享面板，用户能直接「存储图像」进相册
        navigator.share({ files: [file], title: '照片地图墙' }).then(function () {
          showHint('已打开系统分享面板：选「存储图像」就进相册了', 6000);
        }, function () {
          showHint('分享被取消。想再试就再点一次导出。', 5000);
        });
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = name;
      a.rel = 'noopener';
      // 必须挂到文档里再点：Firefox 对游离节点的 download 不生效；
      // iOS Safari 会退化成新标签打开图片，用户长按仍能存下来。
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      // 说清楚导的是什么：当前视野（放大过某省时，导出的就是那个局部）
      showHint('已导出 ' + outW + ' × ' + outH + '（当前视野'
        + ((outW * outH) > EXPORT_SS_MAX_PX ? '' : '，2× 超采样') + '）', 6000);
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(a.href);
      }, 4000);
    }, 'image/png');
  } catch (e) {
    showHint('导出失败：' + e.message + '。可以换 Chrome 或 Safari 再试，或者直接把页面截屏。', 12000);
  } finally {
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
}

/* ------------------------------------------------------------- 启动 --- */
/* 清空并按当前窗口比例重建全部几何（缩放窗口时用）。
   view 是卡片局部坐标下的变换，卡片尺寸不变 → 重建后原视图依然有效。 */
function rebuildCanvas() {
  if (typeof tweenToken !== 'undefined' && tweenToken) { cancelAnimationFrame(tweenToken); tweenToken = null; }
  dragPin = null; panState = null; dragPhoto = null;
  board.textContent = '';
  defsEl = el('defs', null, board);
  yarnNodes.clear(); yarnParts.clear(); photoNodes.clear(); pinNodes.clear();
  photoClips.length = 0;
  provUV.length = 0;
  layoutInfo = null;

  computeCanvas();
  placeCard();
  buildBoard();
  buildCard();
  buildPhotosLayer();
  bindMapInteractions();

  baseView = fitTo(scopeBounds(), CARD.w, CARD.h, 16);
  buildProvinceLabels();
  applyView();
  if (photos.length) renderPhotos();
  if (viewer.classList.contains('on')) fitViewerImg();
}

function boot() {
  board.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  buildGranOptions();   // 粒度下拉的选项跟着地图范围走，进页面就得摆对
  computeCanvas();
  placeCard();

  buildBoard();
  buildCard();
  buildPhotosLayer();
  bindMapInteractions();

  // 基准：中国核心范围适配进卡片
  baseView = fitTo(scopeBounds(), CARD.w, CARD.h, 16);
  view = { s: baseView.s, tx: baseView.tx, ty: baseView.ty };

  // 省名依赖 baseView 定字号，必须放在基准算好之后
  buildProvinceLabels();

  syncGranState();
  useDemo();
  applyView();
  hideHint();

  // 「同一面墙」：先拿到（或造出）本机身份，再接面板
  initWallKey();
  bindSyncUI();
  markSync(syncAllowed() ? 'local' : 'off');

  // 上次的墙：有本机记录就复原，没有就继续放示例；然后再从云端补这台设备缺的那部分。
  // 顺序不能反：本机记录比云端新（刚传完还没写清单）时，先 pull 会被旧清单盖不住，
  // 但先把本机读回来就能保证「本机已有的绝不被云端清单挤掉」。
  restoreFromDB().then(function (n) {
    if (n) showHint('已恢复上次的 ' + n + ' 张照片（这台设备或云端存着）');
    return syncPull();
  }).then(function (k) {
    if (k) showHint('从云端接上了 ' + k + ' 张照片');
    else if (!syncAllowed()) markSync('off');
    else syncScheduleIndex(0);
  }).catch(function () { /* 任何意外都不许影响页面 */ });

  // 窗口尺寸变化 → 重算画布宽度与全部排布（防抖）
  let rzTimer = null;
  window.addEventListener('resize', function () {
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function () { rzTimer = null; rebuildCanvas(); }, 150);
  });
}

/* 自检钩子（供验收用） */
window.__dbg = {
  photos: function () { return photos; },
  polDims: polDims, proj: proj, uvToCard: uvToCard, cardToBoard: cardToBoard,
  layout: function (cw, gap) { const r = ringLayout(photos, cw, gap || 16); return { fits: r.fits, x: r.x, why: ringWhy, slots: ringLen }; },
  ringLen: function () { return ringLen; },
  yarnPath: yarnPath, segCross: segCross,
  parseExifGps: parseExifGps, locateLabel: locateLabel, nearestCity: nearestCity, provinceOf: provinceOf,
  vw: function () { return { s: view.s, tx: view.tx, ty: view.ty }; },
  tgt: function () { return fitPinsTarget(); },
  canvas: function () { return { bw: BW, bh: BH, card: { x: CARD.x, y: CARD.y, w: CARD.w, h: CARD.h } }; },
  baseS: function () { return baseView.s; },
  dbCount: function () { return idbRun('readonly', function (st) { return st.count(); }); },
  wallKey: function () { return wallKey; },
  layoutState: function () {
    return layoutInfo ? { fits: !!layoutInfo.fits, cascade: !!layoutInfo.cascade,
      cells: layoutInfo.cells ? layoutInfo.cells.size : 0, n: photos.length } : null;
  },
  // 诊断：每张照片的针位方位角、被分到的走廊（0上1右2下3左）、以及拿到的锚点
  sideInfo: function () {
    return photos.map(function (p) {
      const c = layoutInfo && layoutInfo.cells && layoutInfo.cells.get(p.uid);
      const pin = cardToBoard(p._pinCard[0], p._pinCard[1]);
      const ang = ringAng(pin[0], pin[1]);
      return { uid: p.uid, ang: Math.round(ang), side: sideOf(ang),
        pin: [Math.round(pin[0]), Math.round(pin[1])],
        ax: c ? Math.round(c.ax) : null, ay: c ? Math.round(c.ay) : null };
    });
  },
  // 测试用：直接给某张照片设/清名次（等价于一次拖动，但不经过指针事件）
  setRank: function (uid, rank) {
    const p = photos.find(function (q) { return q.uid === uid; });
    if (!p) return false;
    p.rank = (rank === null || rank === undefined) ? null : rank;
    patchPhotoRec(p);
    renderPhotos();
    return true;
  },
  // 诊断：绕地图一圈的实际排位（拖动排序的验收依据）
  ringRot: function () { return ringRotDbg; },
  ringSortedDbg: function () { return (layoutInfo && layoutInfo.dbg) || ringOrderDbg; },
  order: function () {
    if (!layoutInfo || !layoutInfo.cells) return [];
    const out = [];
    layoutInfo.cells.forEach(function (c, uid) {
      const p = photos.find(function (q) { return q.uid === uid; });
      out.push({ rank: c.rank, uid: uid, city: p ? p.city : null });
    });
    out.sort(function (a, b) { return a.rank - b.rank; });
    return out;
  },
  // 诊断：环形槽位的屏幕坐标（拖动排序的测试要拿它当落点）
  ringScreen: function () {
    if (!layoutInfo || !layoutInfo.ring) return [];
    const m = layerPhotos.getScreenCTM();
    return layoutInfo.ring.map(function (s, i) {
      const pt = m ? new DOMPoint(s.ax, s.ay).matrixTransform(m) : null;
      return { rank: i, x: pt ? +pt.x.toFixed(1) : 0, y: pt ? +pt.y.toFixed(1) : 0 };
    });
  },
  // 诊断：排布用的锚点（cell.ax/ay）与实际画线用的端点（_pinBoard）是否一致
  ends: function () {
    return photos.map(function (p) {
      const c = layoutInfo && layoutInfo.cells && layoutInfo.cells.get(p.uid);
      return { uid: p.uid, city: p.city,
        ax: c ? +c.ax.toFixed(1) : null, ay: c ? +c.ay.toFixed(1) : null,
        pb: p._pinBoard ? [+p._pinBoard[0].toFixed(1), +p._pinBoard[1].toFixed(1)] : null,
        pos: p.rank == null ? null : p.rank };
    });
  },
  // 诊断「哪些红线在交叉、交叉的两条线各在哪条走廊」——排布单调性排查用
  crossPairs: function () {
    const arr = photos.map(function (p) {
      const c = layoutInfo && layoutInfo.cells && layoutInfo.cells.get(p.uid);
      return c ? { uid: p.uid, pin: cardToBoard(p._pinCard[0], p._pinCard[1]), ax: c.ax, ay: c.ay } : null;
    }).filter(Boolean);
    const out = [];
    for (let a = 0; a < arr.length; a++) for (let b = a + 1; b < arr.length; b++) {
      const A = yarnPath(arr[a].pin, [arr[a].ax, arr[a].ay]);
      const B = yarnPath(arr[b].pin, [arr[b].ax, arr[b].ay]);
      let hit = false;
      for (let x = 0; x < A.length - 1 && !hit; x++) for (let y = 0; y < B.length - 1; y++)
        if (segCross(A[x], A[x + 1], B[y], B[y + 1])) { hit = true; break; }
      if (hit) out.push({
        a: arr[a].uid, b: arr[b].uid,
        pa: arr[a].pin.map(function (v) { return Math.round(v); }),
        pb: arr[b].pin.map(function (v) { return Math.round(v); }),
        sa: [Math.round(arr[a].ax), Math.round(arr[a].ay)],
        sb: [Math.round(arr[b].ax), Math.round(arr[b].ay)]
      });
    }
    return out;
  },
  syncJoin: syncJoin, syncPull: syncPull, syncWipe: syncWipe,
  syncPushIndex: syncPushIndex,
  syncInfo: function () {
    return {
      key: wallKey, state: syncState, code: syncCode,
      remote: syncRemoteCount, allowed: syncAllowed(),
      proto: location.protocol,
    };
  },
};
window.__selfTest = function () {
  const issues = [];
  // 空墙是合法状态（删光之后就是空的），只有「有照片但没有排布」才算错
  if (!layoutInfo && photos.length) issues.push('layout 为空');
  if (layoutInfo && !layoutInfo.fits) issues.push('环形排布放不下：n=' + photos.length);
  // 重叠检测：getBBox 是元素自身坐标系，必须乘 CTM 换到画布坐标
  const boxes = [];
  photos.forEach(function (p) {
    const node = photoNodes.get(p.uid);
    if (!node) { issues.push('缺少照片节点 ' + p.city); return; }
    const b = node.getBBox();
    // getCTM 是「元素 → 屏幕」，还含窗口缩放；先除掉 board 的 CTM，才落在 1600×1000 画布坐标
    const toDM = function (mx) { return new DOMMatrix([mx.a, mx.b, mx.c, mx.d, mx.e, mx.f]); };
    const m = toDM(board.getCTM()).inverse().multiply(toDM(node.getCTM()));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]
      .forEach(function (q) {
        const X = m.a * q[0] + m.c * q[1] + m.e;
        const Y = m.b * q[0] + m.d * q[1] + m.f;
        if (X < x0) x0 = X; if (X > x1) x1 = X;
        if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
      });
    boxes.push({ city: p.city, x: +x0.toFixed(1), y: +y0.toFixed(1),
                 w: +(x1 - x0).toFixed(1), h: +(y1 - y0).toFixed(1) });
  });
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 1 && oy > 1) issues.push('重叠：' + a.city + '×' + b.city + ' ' + ox.toFixed(1) + '×' + oy.toFixed(1));
  }
  // 出界检测
  boxes.forEach(function (b) {
    // 照片现在绕地图一圈，合法范围是整个画布（留 2px 抗锯齿）
    if (b.x < 2 || b.y < 2 || b.x + b.w > BW - 2 || b.y + b.h > BH - 2)
      issues.push('出界：' + b.city + ' ' + JSON.stringify({ x: +b.x.toFixed(1), y: +b.y.toFixed(1), w: +b.w.toFixed(1), h: +b.h.toFixed(1) }));
  });
  // 红线交叉检测：与排布用同一条 yarnPath（同样采样、同样下垂）、同一个针位，口径必须一致
  computePinCard();
  const chains = [];
  photos.forEach(function (p) {
    const from = cardToBoard(p._pinCard[0], p._pinCard[1]);
    const to = p._pinBoard;
    if (!to) return;
    chains.push(yarnPath(from, to));
  });
  let crossings = 0;
  // 与排布共用 segCross（同一阈值），否则「排布判 0、自检判 1」
  for (let i = 0; i < chains.length; i++) for (let j = i + 1; j < chains.length; j++) {
    const A = chains[i], B = chains[j];
    outer:
    for (let a = 0; a < A.length - 1; a++) for (let b = 0; b < B.length - 1; b++)
      if (segCross(A[a], A[a + 1], B[b], B[b + 1])) { crossings++; break outer; }
  }
  return {
    photos: photos.length,
    provinces: provUV.length,
    chinaRings: CHINA_POLYGONS.length,
    baseScale: +baseView.s.toFixed(3),
    viewScale: +view.s.toFixed(3),
    yarns: layerYarnInner.childNodes.length,
    pins: layerPins.childNodes.length,
    crossings: crossings,
    boxes: boxes,
    issues: issues
  };
};

boot();

})();
