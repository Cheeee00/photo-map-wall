/* 全球档：点在哪国（用简化后的世界国界；找不到就返回 null） */
const WORLD_BOX = [];      // 每个国家的包围盒，先粗筛再逐点判
function worldPrep() {
  if (WORLD_BOX.length) return;
  for (let i = 0; i < WORLD.length; i++) {
    let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
    const ps = WORLD[i].p;
    for (let a = 0; a < ps.length; a++) for (let b = 0; b < ps[a].length; b++) {
      const q = ps[a][b];
      if (q[0] < u0) u0 = q[0]; if (q[0] > u1) u1 = q[0];
      if (q[1] < v0) v0 = q[1]; if (q[1] > v1) v1 = q[1];
    }
    WORLD_BOX.push({ u0: u0, u1: u1, v0: v0, v1: v1 });
  }
}
function countryOf(lon, lat) {
  worldPrep();
  for (let i = 0; i < WORLD.length; i++) {
    const b = WORLD_BOX[i];
    if (lon < b.u0 || lon > b.u1 || lat < b.v0 || lat > b.v1) continue;
    const ps = WORLD[i].p;                    // 每个国家 = 若干独立外环
    for (let a = 0; a < ps.length; a++) if (pipRing(ps[a], lon, lat)) return WORLD[i].n;
  }
  return null;
}

/* --------------------------------------------------------- 地图变换应用 --- */
function applyView() {
  layerMapContent.setAttribute('transform',
    'translate(' + nf(view.tx) + ' ' + nf(view.ty) + ') scale(' + view.s + ')');
  syncPins();
  drawYarn();
}

function uvOf(city) { const c = CITY_INDEX[city]; return c ? proj(c.lon, c.lat) : null; }

/* 世界 uv → 卡片局部坐标 */
function uvToCard(u, v) { return [u * view.s + view.tx, v * view.s + view.ty]; }

/* ------------------------------------------------------------- 大头针 --- */
let pinNodes = new Map();   // uid -> <g>

/* 地图上针的位置（卡片局部坐标）。
   相距过近的针（同一地点连拍、广州↔深圳这种）沿水平错开，免得钉成一个点。
   ★ 画针、画线、排布、自检四个消费方必须都读 p._pinCard，
     否则「排布按 A 点算、自检按 B 点算」就会出现永远消不掉的交叉。 */
const PIN_GAP = 15;
function computePinCard() {
  const placed = [];
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    const uv = proj(clampLon(p.lon), clampLat(p.lat));
    const x0 = uv[0] * view.s + view.tx, y0 = uv[1] * view.s + view.ty;
    let x = x0;
    for (let k = 1; k <= 12; k++) {
      let hit = false;
      for (let j = 0; j < placed.length; j++) {
        if (Math.abs(placed[j][0] - x) < PIN_GAP && Math.abs(placed[j][1] - y0) < PIN_GAP) { hit = true; break; }
      }
      if (!hit) break;
      const step = Math.ceil(k / 2) * PIN_GAP;
      x = x0 + (k % 2 ? step : -step);
    }
    placed.push([x, y0]);
    p._pinCard = [x, y0];
  }
}

function syncPins() {
  // 清掉多余的
  pinNodes.forEach(function (g, uid) {
    if (!photos.some(function (p) { return p.uid === uid; })) { g.remove(); pinNodes.delete(uid); }
  });
  computePinCard();

  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    let g = pinNodes.get(p.uid);
    if (!g) {
      g = el('g', { class: 'pin', 'data-uid': p.uid }, layerPins);
      el('ellipse', { cx: 1.5, cy: 4.5, rx: 6.5, ry: 3.2, fill: '#2A1B12', opacity: 0.28 }, g);
      el('circle', { r: PIN_R, fill: '#C0392B', stroke: '#8E2B22', 'stroke-width': 1.1 }, g);
      el('circle', { cx: -2, cy: -2.2, r: 2.3, fill: '#E8756A', opacity: 0.9 }, g);
      el('circle', { cx: 0, cy: 0, r: 1.9, fill: '#7C1F16', opacity: 0.55 }, g);
      g.addEventListener('pointerdown', onPinDown);
      g.addEventListener('pointerenter', function () { highlight(+g.getAttribute('data-uid'), true); });
      g.addEventListener('pointerleave', function () { highlight(+g.getAttribute('data-uid'), false); });
      pinNodes.set(p.uid, g);
    }
    const c = p._pinCard;
    g.setAttribute('transform', 'translate(' + nf(c[0]) + ' ' + nf(c[1]) + ')');
  }
}

function highlight(uid, on) {
  const el2 = photoNodes.get(uid);
  if (el2) el2.style.filter = on ? 'brightness(1.06) drop-shadow(0 0 6px rgba(192,57,43,.5))' : '';
  const y = yarnNodes.get(uid);
  if (y) y.setAttribute('stroke-width', on ? 4.2 : 3.1);
}

/* --------------------------------------------------------------- 红线 --- */
let layerYarnInner;
const yarnNodes = new Map();
const yarnParts = new Map();

function yarnD(p) {
  const from = cardToBoard(p._pinCard[0], p._pinCard[1]);
  const to = p._pinBoard;
  if (!to) return null;
  return {
    from: from, to: to,
    d: 'M' + nf(from[0]) + ' ' + nf(from[1]) + 'L' + nf(to[0]) + ' ' + nf(to[1])
  };
}

function drawYarn() {
  layerYarnInner.textContent = '';
  yarnNodes.clear();
  yarnParts.clear();
  computePinCard();
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    const y = yarnD(p);
    if (!y) continue;

    // 毛线绷直 —— 与 yarnPath() 必须是同一条几何，否则「按 A 排布、按 B 验收」
    const g = el('g', { opacity: 0.95 }, layerYarnInner);
    const main = el('path', { d: y.d, fill: 'none', stroke: '#B03A2E', 'stroke-width': 3.1,
                              'stroke-linecap': 'round' }, g);
    const hi = el('path', { d: y.d, fill: 'none', stroke: '#D9534F', 'stroke-width': 1.1,
                 'stroke-linecap': 'round', opacity: 0.4 }, g);
    // 两端线结
    const k1 = el('circle', { cx: nf(y.from[0]), cy: nf(y.from[1]), r: 3, fill: '#8E2B22' }, g);
    const k2 = el('circle', { cx: nf(y.to[0]), cy: nf(y.to[1]), r: 2.6, fill: '#8E2B22' }, g);
    yarnNodes.set(p.uid, main);
    yarnParts.set(p.uid, { main: main, hi: hi, k1: k1, k2: k2 });
  }
}

/* 单张照片的线就地更新（拖动时用，避免整层重建） */
function updateYarnFor(p) {
  const y = yarnD(p);
  const q = yarnParts.get(p.uid);
  if (!y || !q) return;
  q.main.setAttribute('d', y.d);
  q.hi.setAttribute('d', y.d);
  q.k1.setAttribute('cx', nf(y.from[0])); q.k1.setAttribute('cy', nf(y.from[1]));
  q.k2.setAttribute('cx', nf(y.to[0])); q.k2.setAttribute('cy', nf(y.to[1]));
}

/* --------------------------------------------------------------- 照片 --- */
const photoNodes = new Map();
const photoClips = [];
let layoutInfo = null;

function buildPhotosLayer() {
  // 先照片后红线 → 毛线压在照片上面（用户要的观感：线是搭在照片上的）
  layerPhotos = el('g', { id: 'gPhotos' }, board);
  layerYarn = el('g', { id: 'gYarn' }, board);
  layerYarnInner = el('g', null, layerYarn);
  layerHint = el('g', { id: 'gHint', 'pointer-events': 'none' }, board);
  slotHint = el('rect', {
    id: 'slotHint', x: 0, y: 0, width: 0, height: 0, rx: 4,
    fill: 'rgba(192,57,43,.10)', stroke: '#C0392B', 'stroke-width': 2,
    'stroke-dasharray': '7 5', opacity: 0, 'vector-effect': 'non-scaling-stroke'
  }, layerHint);
}

function polDims(p, contentW) {
  const small = contentW < 140;
  const pad = small ? 8 : 12;
  const bot = small ? 26 : 46;
  const ratio = p.h / p.w;
  const contentH = clamp(Math.round(contentW * ratio), Math.round(contentW * 0.72), Math.round(contentW * 1.15));
  return { cw: contentW, ch: contentH, pw: contentW + pad * 2, ph: contentH + pad + bot,
           pad: pad, bot: bot, small: small };
}

/* ------------------------------------------------------- 照片排布 ---------
   照片绕地图卡一圈：上/右/下/左四条走廊，走廊内是统一尺寸的槽位网格。
   红线互不交叉靠三点保证：
     ① 槽位与照片都按「绕卡片中心的方位角」排序，DP 求单调最小角距指派；
     ② 2-opt：交换任一对相交的红线，总长必下降 → 有限步终止，不会死循环；
     ③ 照片的针钉在槽位锚点上（锚点只跟槽位有关，与照片无关 → ② 端点固定，收敛）；
/* 走廊与槽位共用的间距常量。
        M  = 画布外边距（尽量小，否则上下走廊高度不够，塞不进最高的照片 → 上下两排会空着）
        m  = 走廊与地图件之间的间隙
        gap= 槽位之间的间隙
        ayOff = 槽位顶边到照片自身图钉的距离
        槽位按最大外接框取尺寸 → 任意照片放任意槽位都不重叠、不出界。      */
const CORR = { M: 10, m: 10, gap: 12, ayOff: 12 };

/* 四条走廊：左右吃满画布高度，上下夹在两者之间（四角归左右，互不重叠） */
function corridors() {
  const M = CORR.M, m = CORR.m;
  return [
    { x0: CARD.x - m,          y0: M, x1: CARD.x + CARD.w + m,          y1: CARD.y - m },
    { x0: CARD.x + CARD.w + m, y0: M, x1: BW - M,                     y1: BH - M },
    { x0: CARD.x - m,          y0: CARD.y + CARD.h + m, x1: CARD.x + CARD.w + m, y1: BH - M },
    { x0: M,                   y0: M, x1: CARD.x - m,                    y1: BH - M }
  ];
}

/* 槽位网格（统一尺寸），按走廊分成四组：0=上 1=右 2=下 3=左（与 corridors() 同序）。
   组内按锚点的**轴向**坐标升序 —— 上下走廊看 ax（东西），左右走廊看 ay（南北）。
   轴向排序是无交叉的钥匙：引脚都在卡内、锚点都在卡外的同一条走廊里，
   存在一条把两组端点分开的直线，只要两端同序，线段就绝不会相交。 */
function corridorSlots(sw, sh) {
  const gap = CORR.gap, groups = [[], [], [], []];
  corridors().forEach(function (g, gi) {
    const w = g.x1 - g.x0, h = g.y1 - g.y0;
    const cols = Math.floor((w + gap) / (sw + gap));
    const rows = Math.floor((h + gap) / (sh + gap));
    if (cols < 1 || rows < 1) return;
    const ox = (w - (cols * sw + (cols - 1) * gap)) / 2;
    const oy = (h - (rows * sh + (rows - 1) * gap)) / 2;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x = g.x0 + ox + c * (sw + gap), y = g.y0 + oy + r * (sh + gap);
      const ax = x + sw / 2, ay = y + CORR.ayOff;
      groups[gi].push({ x: x, y: y, w: sw, h: sh, ax: ax, ay: ay,
                        ang: ringAng(ax, ay),            // 绕卡片中心的方位角，DP 代价用
                        side: gi, vertical: (gi === 1 || gi === 3) });
    }
  });
  /* 组内按**方位角**升序 —— 这是零交叉的关键：槽位的线性次序必须与图钉的
     方位角次序完全一致。按轴向坐标排会出错：右侧走廊有多列时，「第一列走完
     再接第二列」会让第二列顶端的槽位角度比第一列底端还小，序号一大一小就
     出现端点交错，红线立刻交叉。 */
  groups.forEach(function (list) {
    list.sort(function (a, b) { return a.ang - b.ang || a.ax - b.ax || a.ay - b.ay; });
  });
  return groups;
}

/* 一个点绕卡片中心落在哪条走廊：0=上 1=右 2=下 3=左 */
function sideOf(ang) {
  if (ang >= 315 || ang < 45) return 0;
  if (ang < 135) return 1;
  if (ang < 225) return 2;
  return 3;
}

/* 红线的实际形状：两点之间拉直（毛线绷紧就是直线）。排布与自检都用它。
   只给两个端点 —— 线就是直线，采样 17 点既无意义又让相交判定慢 256 倍。 */
function yarnPath(from, to) {
  return [from, to];
}

/* 两线段是否真相交（端点附近 0.2% 内不算，避免共点误判） */
function segCross(p1, p2, p3, p4) {
  const d1x = p2[0] - p1[0], d1y = p2[1] - p1[1], d2x = p4[0] - p3[0], d2y = p4[1] - p3[1];
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-9) return false;
  const t = ((p3[0] - p1[0]) * d2y - (p3[1] - p1[1]) * d2x) / den;
  const u = ((p3[0] - p1[0]) * d1y - (p3[1] - p1[1]) * d1x) / den;
  return t > 0.002 && t < 0.998 && u > 0.002 && u < 0.998;
}

function ringAng(x, y) { return (Math.atan2(x - CARD.cx, -(y - CARD.cy)) / D2R + 360) % 360; }

let ringLen = 0;   // 供 __dbg 观测：当前档位下可用槽位数
let ringWhy = '';  // 供 __dbg 观测：ringLayout 放弃的原因
let ringOrderDbg = '';
let ringRotDbg = '';   // 供 __dbg 观测：这一轮「照片→次序」的最终排法

/* 排布主入口：返回 {fits, cells: Map(uid→{cx,cy,ax,ay,d})}。
   ax/ay 是照片自己的针（锚点），cx/cy 是照片中心。 */
/* 用户手动排过序的照片带 p.rank = 它想站的「第几号位」（0 起，绕卡片一圈算）。
   用名次而不是坐标，是因为名次与画布尺寸、照片张数都无关：换个窗口、再加两张，
   你排的顺序还在。没带 rank 的照片继续按方位角自动排，带 rank 的插到指定位置。 */
function applyRanks(list) {
  let has = false;
  for (let i = 0; i < list.length; i++) if (list[i].p.rank != null) { has = true; break; }
  if (!has) return;
  const pinned = list.filter(function (q) { return q.p.rank != null; });
  const rest = list.filter(function (q) { return q.p.rank == null; });
  pinned.sort(function (a, b) { return a.p.rank - b.p.rank; });
  for (let i = 0; i < pinned.length; i++) {
    rest.splice(clamp(Math.round(pinned[i].p.rank), 0, rest.length), 0, pinned[i]);
  }
  for (let i = 0; i < list.length; i++) list[i] = rest[i];
}

function ringLayout(items, contentW, gap, probe) {
  void gap;
  ringWhy = '';
  const a = ROT_MAX * D2R, ca = Math.cos(a), sa = Math.sin(a);
  computePinCard();                      // 与画针/画线共用同一份针位
  const info = items.map(function (p) {
    const d = polDims(p, contentW);
    return { p: p, d: d,
             bw: d.pw * ca + d.ph * sa,      // ±4° 旋转后的外接宽
             bh: d.pw * sa + d.ph * ca,      // ±4° 旋转后的外接高
             pin: cardToBoard(p._pinCard[0], p._pinCard[1]) }; // 图钉在画布坐标
  });

  // 统一槽位尺寸 = 最大外接框 → 任意照片放进任意槽位都不会重叠、不会出界
  let bwMax = 0, bhMax = 0;
  info.forEach(function (q) { bwMax = Math.max(bwMax, q.bw); bhMax = Math.max(bhMax, q.bh); });
  const sw = Math.ceil(bwMax) + 2, sh = Math.ceil(bhMax) + 2;
  const slotsG = corridorSlots(sw, sh);
  ringLen = slotsG.reduce(function (a, b) { return a + b.length; }, 0);
  if (ringLen < info.length) { ringWhy = 'slots ' + ringLen + ' < ' + info.length; return { fits: false, cells: new Map() }; }

  /* ① 全局保序指派：把所有走廊的槽位合成一条「按方位角升序」的列表，
        再把照片按方位角升序，用 DP 挑出等量且**次序完全一致**的一批。
        零交叉靠的就是这条次序一致性：锚点在外圈、图钉在内圈，两圈点按同一
        循环次序配对时线段互不相交（经典结论）。
        早先按走廊切「连续的弧」再分头指派，窄画布上图钉全挤在东侧时会把照片
        推进零槽位的走廊而直接失败；合成一条列表既不会失败，次序也没变。 */
  info.forEach(function (q) { q.ang = ringAng(q.pin[0], q.pin[1]); });

  const slotsAll = slotsG[0].concat(slotsG[1], slotsG[2], slotsG[3])
    .sort(function (a, b) { return a.ang - b.ang || a.ax - b.ax || a.ay - b.ay; });
  /* 两件事分开算，否则互相干扰：
     ① 槽位序列：只按「图钉方位角」排（natural），跟手工顺序无关 —— 这样槽位密度
        只由照片尺寸和画布决定，同一批照片每次挑出来的槽位都一样；
     ② 谁站哪个槽位：把用户排过的名次插进去（order），再一一对应。
     早先把①也交给带名次的序列，结果换位的照片会把整条槽位序列拽偏，落点和虚线框对不上。 */
  const natural = info.slice().sort(function (a, b) { return a.ang - b.ang; });
  const order = natural.slice();
  applyRanks(order);

  const pick = new Array(info.length);   // info 下标 → 槽位
  const index = new Map();
  info.forEach(function (q, i) { index.set(q, i); });

  /* 一维保序 DP：从 n 个有序槽位里挑 k 个给 k 张有序照片，最小化 Σ|方位角之差|。 */
  let chosenRing = null;                 // 这一轮真正用上的槽位（按绕行顺序），拖动吸附要用
  (function assign() {
    const k = natural.length, n = slotsAll.length;
    if (k === n) chosenRing = slotsAll.slice();
    else {
      const INF = 1e18;
      const dp = [], from = [];
      for (let i = 0; i <= n; i++) { dp.push(new Array(k + 1).fill(INF)); from.push(new Array(k + 1).fill(false)); }
      dp[0][0] = 0;
      const cost = function (slot, q) { return Math.abs(slot.ang - q.ang); };
      for (let i = 1; i <= n; i++) for (let j = 0; j <= k; j++) {
        dp[i][j] = dp[i - 1][j];
        if (j > 0 && dp[i - 1][j - 1] < INF) {
          const v = dp[i - 1][j - 1] + cost(slotsAll[i - 1], natural[j - 1]);
          if (v < dp[i][j]) { dp[i][j] = v; from[i][j] = true; }
        }
      }
      const chosen = new Array(k);
      for (let i = n, j = k; i > 0 && j > 0; i--) if (from[i][j]) { chosen[j - 1] = slotsAll[i - 1]; j--; }
      chosenRing = chosen;
    }
    for (let i = 0; i < k; i++) pick[index.get(order[i])] = chosenRing[i];
  })();
  for (let i = 0; i < info.length; i++) if (!pick[i]) { ringWhy = 'unassigned ' + i; return { fits: false, cells: new Map() }; }

  ringOrderDbg = order.map(function (q, i) {
    return q.p.city + (q.p.rank == null ? '' : '#' + q.p.rank) + '@' + Math.round(pick[index.get(q)].ang);
  }).join(' ');

  // 针固定在槽位锚点上，照片中心由锚点 + 旋转反解出来
  const cellsOf = function (pk) {
    const mp = new Map();
    for (let i = 0; i < info.length; i++) {
      const s = pk[i], q = info[i], d = q.d;
      const rot = angOf(q.p.uid), rad = rot * D2R;
      const ly = PIN_Y - d.ph / 2;                 // 针相对照片中心的偏移（lx 恒为 0）
      mp.set(q.p.uid, {
        cx: s.ax + ly * Math.sin(rad),
        cy: s.ay - ly * Math.cos(rad),
        ax: s.ax, ay: s.ay, rot: rot, d: d,
        rank: ringAng(s.ax, s.ay)    // 这个槽位绕卡片一圈的角度 → 用来还原「第几号位」
      });
    }
    return mp;
  };

  /* ② 2-opt：主目标 = 总交叉数，次目标 = 总线长。
     只接受「交叉数不增」的交换；同交叉数时要求线长下降 → 单调有界，有限步终止。 */
  const segLen = function (a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  const pathLen = function (pts) {
    let L = 0;
    for (let k = 0; k < pts.length - 1; k++) L += segLen(pts[k], pts[k + 1]);
    return L;
  };
  const crossP = function (A, B) {
    for (let x = 0; x < A.length - 1; x++) for (let y = 0; y < B.length - 1; y++)
      if (segCross(A[x], A[x + 1], B[y], B[y + 1])) return true;
    return false;
  };

  /* ② 优化器：主目标 = 总交叉数，次目标 = 总线长。
     每轮只看「参与交叉」的那些照片，给它们两种移动：
       (a) 挪到一个空槽位（单点移动，2-opt 做不到的位移）；
       (b) 与另一张交换槽位。
     只接受交叉数下降（或不变但线更短）的移动 → 有界单调，有限步终止。
     增量判据：只统计「涉及被移动的那几条线」的交叉，O(m) 而不是 O(m²)。 */
  const m = info.length;
  const slotsAllFlat = slotsG[0].concat(slotsG[1], slotsG[2], slotsG[3]);
  const usedSet = new Set(pick);
  const free = [];
  for (let i = 0; i < slotsAllFlat.length; i++) if (!usedSet.has(slotsAllFlat[i])) free.push(slotsAllFlat[i]);

  // 每条红线的折线；交换 i/j 后只需重算这两条
  const chain = pick.map(function (s, i) { return yarnPath(info[i].pin, [s.ax, s.ay]); });
  const chainLen = chain.map(pathLen);
  const totalX = function () {
    let c = 0;
    for (let a = 0; a < m; a++) for (let b = a + 1; b < m; b++) if (crossP(chain[a], chain[b])) c++;
    return c;
  };
  const crossWith = function (i, line) {
    let c = 0;
    for (let j = 0; j < m; j++) if (j !== i && crossP(line, chain[j])) c++;
    return c;
  };
  let curX = totalX();
  let curL = chainLen.reduce(function (a, b) { return a + b; }, 0);
  if (probe) return { fits: true, cells: cellsOf(pick), x: curX, ring: chosenRing, dbg: ringOrderDbg };   // 只探可行性/交叉数，不跑优化器

  /* 手动排过序的照片（p.rank != null）不许优化器搬走：位置是用户自己指定的，
     系统只负责把其余照片排好。代价要说清楚 —— 强行换到不相称的位次时，
     连线必然可能交叉（提示里会告诉用户，并给一次撤销）。 */
  /* 名次和"照片本来该在的位置"完全一致时，别当锁 —— 否则会白丢优化器带来的零交叉。
     只有名次真的把某张照片挪了位，才算"手动排序"。 */
  let rankConsistent = true;
  (function () {
    const nat = info.slice().sort(function (a, b) { return a.ang - b.ang; });
    for (let i = 0; i < nat.length; i++) {
      const r = nat[i].p.rank;
      if (r == null) continue;
      if (Math.round(r) !== i) { rankConsistent = false; break; }
    }
  })();
  const locked = rankConsistent ? info.map(function () { return false; })
    : info.map(function (q) { return q.p.rank != null; });
  const anyLocked = locked.some(Boolean);
  const canMove = function (i) { return !locked[i]; };
  const optimize = function (maxPass) {
    for (let pass = 0; pass < maxPass && curX > 0; pass++) {
      const bad = [], isBad = new Array(m).fill(false);
      for (let a = 0; a < m; a++) for (let b = a + 1; b < m; b++) {
        if (crossP(chain[a], chain[b])) { isBad[a] = true; isBad[b] = true; }
      }
      for (let a = 0; a < m; a++) if (isBad[a]) bad.push(a);
      if (!bad.length) break;

      let moved = false;

      /* (a) 单点挪到空槽位 */
      let bestMv = null;
      for (let bi = 0; bi < bad.length; bi++) {
        const i = bad[bi];
        if (!canMove(i)) continue;                 // 手动排过位的照片不动
        const oldC = crossWith(i, chain[i]);
        if (!oldC) continue;
        for (let fi = 0; fi < free.length; fi++) {
          const s = free[fi];
          const L = yarnPath(info[i].pin, [s.ax, s.ay]);
          const c = crossWith(i, L);
          const L2 = pathLen(L);
          if (c > oldC) continue;
          if (c === oldC && L2 >= chainLen[i] - 1e-9) continue;  // 平局只走更短的 → 保证收敛
          if (!bestMv || c < bestMv.c || (c === bestMv.c && L2 < bestMv.L2))
            bestMv = { i: i, s: s, L: L, c: c, L2: L2, old: oldC };
        }
      }
      if (bestMv) {
        const i = bestMv.i, oldSlot = pick[i];
        chain[i] = bestMv.L;
        chainLen[i] = pathLen(bestMv.L);
        pick[i] = bestMv.s;
        const k = free.indexOf(bestMv.s);
        if (k >= 0) free.splice(k, 1);
        free.push(oldSlot);
        curX -= (bestMv.old - bestMv.c);
        curL = chainLen.reduce(function (a, b) { return a + b; }, 0);
        moved = true;
      }

      /* (b) 两两交换（只和 bad 里的线配对，省掉无意义的一半组合） */
      if (!moved) {
        let best = null;
        for (let x = 0; x < bad.length; x++) {
          const i = bad[x];
          if (!canMove(i)) continue;
          for (let j = 0; j < m; j++) {
            if (j === i || !canMove(j)) continue;
            const Ai = yarnPath(info[i].pin, [pick[j].ax, pick[j].ay]);
            const Aj = yarnPath(info[j].pin, [pick[i].ax, pick[i].ay]);
            const oi = chain[i], oj = chain[j];
            chain[i] = Ai; chain[j] = Aj;
            const c = totalX();
            chain[i] = oi; chain[j] = oj;
            if (c > curX) continue;
            const L2 = curL - chainLen[i] - chainLen[j] + pathLen(Ai) + pathLen(Aj);
            if (c === curX && L2 >= curL - 1e-9) continue;   // 平局只走更短的
            if (!best || c < best.c || (c === best.c && L2 < best.L)) best = { i: i, j: j, c: c, L: L2 };
          }
        }
        if (best) {
          const i = best.i, j = best.j;
          const Ai = yarnPath(info[i].pin, [pick[j].ax, pick[j].ay]);
          const Aj = yarnPath(info[j].pin, [pick[i].ax, pick[i].ay]);
          chain[i] = Ai; chain[j] = Aj;
          chainLen[i] = pathLen(Ai); chainLen[j] = pathLen(Aj);
          const t = pick[i]; pick[i] = pick[j]; pick[j] = t;
          curX = best.c;
          curL = chainLen.reduce(function (a, b) { return a + b; }, 0);
          moved = true;
        }
      }

      if (!moved) break;
    }
  };

  /* 用户手工排过位就不优化：优化器只管“少交叉”，它会随手把别人的照片挪来挪去，
     结果就是「拖到第 6 位，松手后它变成第 4 位」。宁可留几处交叉（提示里已经会说），
     也不能让用户的手工顺序被悄悄打乱。想回到自动排位 → 大图里点「自动排位」。 */

  /* 手动排过位时优化器被禁用，剩下的交叉靠「整体循环旋转」消：
     外圈槽位与内圈图钉都按同一个循环次序绕，只要两边保持循环次序一致，
     线段就不相交。所以把没锁定的照片在空出来的槽位上整体转一个角度试一遍，
     取交叉最少（其次总线长最短）的那一圈。这样「拖到第 6 位」既能保住，
     又能把绝大多数情况下的交叉消成 0。 */
  if (anyLocked && curX > 0) {
    const seqPos = order.map(function (q) { return index.get(q); });      // 序位 → info 下标
    const posLocked = seqPos.map(function (pi) { return locked[pi]; });
    const usedBy = new Set();
    for (let i = 0; i < seqPos.length; i++) if (posLocked[i]) usedBy.add(pick[seqPos[i]]);
    const freeSlots = chosenRing.filter(function (s) { return !usedBy.has(s); });
    const freePos = [];
    for (let i = 0; i < seqPos.length; i++) if (!posLocked[i]) freePos.push(i);
    if (freeSlots.length === freePos.length && freePos.length > 1) {
      const setChain = function (pi) {
        chain[pi] = yarnPath(info[pi].pin, [pick[pi].ax, pick[pi].ay]);
        chainLen[pi] = pathLen(chain[pi]);
      };
      const place = function (r) {
        for (let j = 0; j < freePos.length; j++) {
          pick[seqPos[freePos[(j + r) % freePos.length]]] = freeSlots[j];
        }
        for (let j = 0; j < freePos.length; j++) setChain(seqPos[freePos[j]]);
      };
      let bestR = 0, bestX = curX, bestL = curL;
      for (let r = 1; r < freePos.length; r++) {
        place(r);
        const x = totalX();
        const L = chainLen.reduce(function (a, b) { return a + b; }, 0);
        if (x < bestX || (x === bestX && L < bestL - 1e-9)) { bestX = x; bestL = L; bestR = r; }
      }
      place(bestR);
      curX = bestX; curL = bestL;
      ringRotDbg = 'rot n=' + freePos.length + ' bestR=' + bestR + ' x=' + bestX;
    }
  }
  if (!anyLocked) optimize(200);

  /* 保序指派本身已经能吃掉绝大多数交叉，剩下的零星交叉往往是「局部最优」：
     单点移动和两两交换都会让交叉数上升。这里做确定性随机扰动（固定步长的
     伪随机，不用 Math.random，保证同一批照片每次排出同一个结果）后再优化，
     只保留更好的状态。 */
  if (curX > 0 && !anyLocked) {
    const snap = function () { return { pick: pick.slice(), chain: chain.slice(), len: chainLen.slice(), x: curX, L: curL }; };
    const load = function (s) {
      for (let t = 0; t < m; t++) { pick[t] = s.pick[t]; chain[t] = s.chain[t]; chainLen[t] = s.len[t]; }
      curX = s.x; curL = s.L;
      free.length = 0;
      const used = new Set(pick);
      for (let i = 0; i < slotsAllFlat.length; i++) if (!used.has(slotsAllFlat[i])) free.push(slotsAllFlat[i]);
    };
    let best = snap();
    for (let k = 1; k <= 80 && best.x > 0; k++) {
      const i = (k * 37) % m, j = (k * 91 + 11) % m;
      if (i === j) continue;
      const ti = pick[i]; pick[i] = pick[j]; pick[j] = ti;
      chain[i] = yarnPath(info[i].pin, [pick[i].ax, pick[i].ay]);
      chain[j] = yarnPath(info[j].pin, [pick[j].ax, pick[j].ay]);
      chainLen[i] = pathLen(chain[i]); chainLen[j] = pathLen(chain[j]);
      curX = totalX(); curL = chainLen.reduce(function (a, b) { return a + b; }, 0);
      optimize(60);
      if (curX < best.x || (curX === best.x && curL < best.L - 1e-9)) best = snap();
      else load(best);
    }
    load(best);
  }


  // ③ 输出
  ringOrderDbg = order.map(function (q) { return q.p.city + (q.p.rank == null ? '' : '#' + q.p.rank) + '@' + Math.round(pick[index.get(q)].ang); }).join(' ');
  return { fits: true, cells: cellsOf(pick), x: curX, ring: chosenRing, dbg: ringOrderDbg };
}

/* 极端兜底：槽位不够时多出来的照片沿同一槽位阶梯叠放（像真的拍立得摞在一起） */
function cascadeLayout(items, contentW) {
  const a = ROT_MAX * D2R, ca = Math.cos(a), sa = Math.sin(a);
  const info = items.map(function (p) {
    const d = polDims(p, contentW);
    return { p: p, d: d, bw: d.pw * ca + d.ph * sa, bh: d.pw * sa + d.ph * ca };
  });
  let bwMax = 0, bhMax = 0;
  info.forEach(function (q) { bwMax = Math.max(bwMax, q.bw); bhMax = Math.max(bhMax, q.bh); });
  const groups = corridorSlots(Math.ceil(bwMax) + 2, Math.ceil(bhMax) + 2);
  const slots = groups[0].concat(groups[1], groups[2], groups[3]);
  const cells = new Map();
  if (!slots.length) return { fits: false, cells: cells };
  const n = slots.length;
  info.forEach(function (q, i) {
    const s = slots[i % n], k = Math.floor(i / n);
    const ax = s.ax + k * 6, ay = s.ay + k * 6;
    const rot = angOf(q.p.uid), rad = rot * D2R;
    const ly = PIN_Y - q.d.ph / 2;
    cells.set(q.p.uid, {
      cx: ax + ly * Math.sin(rad),
      cy: ay - ly * Math.cos(rad),
      ax: ax, ay: ay, rot: rot, d: q.d
    });
  });
  return { fits: true, cells: cells, cascade: true };
}

/* 每张照片的旋转角：uid 派生、稳定不变（刷新/重排后仍是同一个角度） */
const PIN_Y = 9;
function angOf(uid) { return ((uid * 2654435761) % 1000 / 1000 * 2 - 1) * ROT_MAX; }


function renderPhotos() {
  layerYarnInner.textContent = '';
  photoNodes.clear();
  layerPhotos.textContent = '';
  yarnNodes.clear();
  // 清掉上一轮的照片裁剪路径，避免同 id 残留
  photoClips.forEach(function (n) { n.remove(); });
  photoClips.length = 0;

  if (!photos.length) { layoutInfo = null; return; }

  // 找合适的内容宽：先用二分找「放得下的最大档」，再往下试两档取交叉最少的
  const tryList = [200, 190, 180, 170, 160, 150, 140, 130, 120, 110, 100, 92, 84, 76, 68, 60, 54, 48, 42];
  const gapOf = function (w) { return w < 140 ? 8 : 14; };
  let lo = 0, hi = tryList.length - 1, firstFit = -1;
  while (lo <= hi) {                       // tryList 单调递减：越大越难放下
    const mid = (lo + hi) >> 1;
    const r = ringLayout(photos, tryList[mid], gapOf(tryList[mid]), true);
    if (r.fits) { firstFit = mid; hi = mid - 1; } else { lo = mid + 1; }
  }
  let lay = null, contentW = tryList[tryList.length - 1];
  if (firstFit >= 0) {
    /* 先按 probe 的交叉数给候选排序（并列时取照片更大的），再按顺序真优化，
       第一个优化到 0 交叉的就收工；都不为 0 就取交叉最少的。 */
    const cands = [];
    for (let k = firstFit; k < Math.min(firstFit + 3, tryList.length); k++) {
      const w = tryList[k];
      const r = ringLayout(photos, w, gapOf(w), true);
      if (r.fits) cands.push({ w: w, x: r.x || 0, k: k });
    }
    cands.sort(function (a, b) { return a.x - b.x || a.k - b.k; });
    let bestX = Infinity;
    for (let ci = 0; ci < cands.length; ci++) {
      const r = ringLayout(photos, cands[ci].w, gapOf(cands[ci].w));
      if (!r.fits) continue;
      const x = r.x || 0;
      if (!lay || x < bestX) { lay = r; contentW = cands[ci].w; bestX = x; }
      if (!bestX) break;
    }
  }
  if (!lay) {
    // 连最小档都放不下：用最小档做阶梯叠放（大档会摊成一片重叠）
    contentW = tryList[tryList.length - 1];
    lay = cascadeLayout(photos, contentW);
  }
  lay.cw = contentW;   // 记住这一轮用的照片宽度，拖动换位时要按同一档重算
  layoutInfo = lay;

  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    const cell = lay.cells.get(p.uid);
    if (!cell) continue;
    const d = cell.d;

    // 针固定在槽位锚点上（布局算好的），旋转角由 uid 派生 → 稳定不变
    const rot = cell.rot;
    // 位置完全由布局决定（手工拖动通过 p.rank 参与排序，不直接改坐标 → 红线仍不交叉）
    const cx = cell.cx, cy = cell.cy;
    p._cx = cx; p._cy = cy; p._rot = rot; p._dims = d;

    const g = el('g', {
      class: 'polaroid',
      'data-uid': p.uid,
      transform: 'translate(' + nf(cx) + ' ' + nf(cy) + ') rotate(' + rot.toFixed(2) +
                 ') translate(' + (-d.pw / 2) + ' ' + (-d.ph / 2) + ')'
    }, layerPhotos);

    // 阴影
    el('rect', { x: 2, y: 5, width: d.pw, height: d.ph, fill: '#000', opacity: 0.30,
                 filter: 'url(#softShadow)', rx: 1.5 }, g);
    // 相纸
    el('rect', { x: 0, y: 0, width: d.pw, height: d.ph, fill: '#FCF8F1', rx: 1.5 }, g);
    el('rect', { x: 0, y: 0, width: d.pw, height: d.ph, fill: 'none',
                 stroke: '#D9CFBE', 'stroke-width': 0.7, rx: 1.5 }, g);

    // 内容
    const clipId = 'ph' + p.uid;
    const cp = el('clipPath', { id: clipId }, defsEl);
    photoClips.push(cp);
    el('rect', { x: d.pad, y: d.pad, width: d.cw, height: d.ch }, cp);

    {
      const im = el('image', { x: d.pad, y: d.pad, width: d.cw, height: d.ch, href: p.url,
                    preserveAspectRatio: 'xMidYMid slice', 'clip-path': 'url(#' + clipId + ')' }, g);
      im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', p.url);
    }

    // 地点手写标签。拖针时要能就地改字（不重排整面墙），所以留一个节点引用。
    const labY = d.pad + d.ch + (d.small ? 17 : 29);
    const lab = textNode(p.city, {
      x: d.pw / 2, y: labY, 'text-anchor': 'middle',
      'font-size': d.small ? 11 : 15.5,
      'font-family': "'Segoe Script','Bradley Hand','Xingkai SC','KaiTi','STKaiti',cursive",
      fill: '#3D342B', opacity: 0.88, 'letter-spacing': 0.6
    }, g);
    p._labNode = lab;
    // 没有拍摄定位的照片，位置是猜的 —— 标签长得太像真的会误导，所以标一句「待确认」
    if (!p.gps && !p.demo) {
      const tag = textNode('位置待确认', {
        x: d.pw / 2, y: labY + (d.small ? 10 : 12.5), 'text-anchor': 'middle',
        'font-size': d.small ? 8 : 8.5, class: 'pendingTag',
        fill: '#B4643A', opacity: 0.9, 'letter-spacing': 0.4,
        'font-family': "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif",
      }, g);
      p._tagNode = tag;
    } else {
      p._tagNode = null;
    }

    // 照片自己的针（顶边中点）
    const localPinX = d.pw / 2, localPinY = 9;
    const a2 = rot * D2R, c2 = Math.cos(a2), s2 = Math.sin(a2);
    const lx = localPinX - d.pw / 2, ly = localPinY - d.ph / 2;
    p._pinBoard = [cx + lx * c2 - ly * s2, cy + lx * s2 + ly * c2];

    const pg = el('g', { transform: 'translate(' + localPinX + ' ' + localPinY + ')' }, g);
    el('ellipse', { cx: 1.5, cy: 4.5, rx: 6.5, ry: 3.2, fill: '#2A1B12', opacity: 0.3 }, pg);
    el('circle', { r: PIN_R, fill: '#C0392B', stroke: '#8E2B22', 'stroke-width': 1.1 }, pg);
    el('circle', { cx: -2, cy: -2.2, r: 2.3, fill: '#E8756A', opacity: 0.9 }, pg);
    el('circle', { cx: 0, cy: 0, r: 1.9, fill: '#7C1F16', opacity: 0.55 }, pg);

    g.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (p._skipClick) { p._skipClick = false; return; }   // 刚拖过，别当点击
      openViewer(p.uid);
    });
    g.addEventListener('pointerdown', function (ev) { onPhotoDown(ev, p); });
    g.addEventListener('pointermove', onPhotoMove);
    g.addEventListener('pointerup', onPhotoUp);
    g.addEventListener('pointercancel', onPhotoUp);

    photoNodes.set(p.uid, g);
  }

  applyView();
}

/* ------------------------------------------------------------ 自动全览 --- */
function clampView(t) { return { s: clamp(t.s, baseView.s * 0.8, baseView.s * 11), tx: t.tx, ty: t.ty }; }

/* 取景目标对应的视图（只算不改）
   粒度=全部 → 打卡点外接框（带防过近撑开）
   粒度=省/城市 → 直接把该级范围框进去（允许比 baseView 大很多，这是用户明确要的） */
function fitPinsTarget() {
  if (!photos.length) return null;

  const gb = granBox();
  if (gb) {
    const padU = Math.max((gb.u1 - gb.u0) * 0.14, 0.6);
    const padV = Math.max((gb.v1 - gb.v0) * 0.14, 0.6);
    return clampView(fitTo({
      u0: gb.u0 - padU, u1: gb.u1 + padU,
      v0: gb.v0 - padV, v1: gb.v1 + padV
    }, CARD.w, CARD.h, 72));
  }

  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  for (let i = 0; i < photos.length; i++) {
    const uv = proj(photos[i].lon, photos[i].lat);
    if (uv[0] < u0) u0 = uv[0]; if (uv[0] > u1) u1 = uv[0];
    if (uv[1] < v0) v0 = uv[1]; if (uv[1] > v1) v1 = uv[1];
  }
  // 1 张、或 2–3 张挤在一起时，视野撑开到接近全中国：
  // 否则一上传就放大到「只剩一个省」的区域级画面，用户根本认不出是中国（iPhone 实测反馈）
  const n = photos.length;
  const minSpan = n === 1 ? 58 : n <= 3 ? 34 : 11;
  const cu = (u0 + u1) / 2, cv = (v0 + v1) / 2;
  let spanU = Math.max(u1 - u0, minSpan);
  let spanV = Math.max(v1 - v0, minSpan * 0.72);
  const mk = function () {
    return { u0: cu - spanU / 2, u1: cu + spanU / 2, v0: cv - spanV / 2, v1: cv + spanV / 2 };
  };
  let t = fitTo(mk(), CARD.w, CARD.h, 88);
  // 硬上限：不超过全中国基准视图的 1.5 倍 —— 再大就不像「一张中国地图」了
  const capS = baseView.s * 1.5;
  if (t.s > capS) {
    const k = t.s / capS;
    spanU *= k; spanV *= k;
    t = fitTo(mk(), CARD.w, CARD.h, 88);
  }
  // 下限：不低于中国全览（fitTo 是把外接框居中，所以放大比例、中心不动即可）
  if (t.s < baseView.s) t = { s: baseView.s, tx: t.tx, ty: t.ty };
  return clampView(t);
}

/* 先按终态视图重排红线（零交叉只针对终态成立），再补间过去 */
function flyTo(target, animated) {
  if (!target) return;
  const prev = { s: view.s, tx: view.tx, ty: view.ty };
  view = { s: target.s, tx: target.tx, ty: target.ty };
  renderPhotos();
  const t = { s: view.s, tx: view.tx, ty: view.ty };
  view = prev;
  setView(t, animated);
}

function fitToPins(animated) { flyTo(fitPinsTarget(), animated); }

/* 没有真实照片时（示例状态）默认回到中国全览，上传后才聚焦到自己的打卡点 */
function resetView(animated) {
  const fb = document.getElementById('btnFit');
  if (fb) fb.classList.remove('hasnew');       // 「有新照片」提示到此为止
  if (!photos.length || photos.every(function (p) { return p.demo; })) setView(baseView, animated);
  // 示例状态下粒度无意义，按 baseView 走
  else fitToPins(animated);
}

function setView(target, animated) {  const s = clamp(target.s, baseView.s * 0.8, baseView.s * 11);
  const t = { s: s, tx: target.tx, ty: target.ty };
  if (!animated) {
    if (tweenToken) { cancelAnimationFrame(tweenToken); tweenToken = null; }
    view = t; applyView(); return;
  }
  const from = { s: view.s, tx: view.tx, ty: view.ty };
  const t0 = performance.now(), dur = 560;
  if (tweenToken) cancelAnimationFrame(tweenToken);
  (function step() {
    const k = Math.min(1, (performance.now() - t0) / dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    view.s = from.s + (t.s - from.s) * e;
    view.tx = from.tx + (t.tx - from.tx) * e;
    view.ty = from.ty + (t.ty - from.ty) * e;
    applyView();
    tweenToken = k < 1 ? requestAnimationFrame(step) : null;
  })();
}

/* --------------------------------------------------------- 交互：指针 --- */
function clientToBoard(ev) {
  const m = board.getScreenCTM();
  if (!m) return [0, 0];
  const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
  return [pt.x, pt.y];
}

let dragPin = null;

function onPinDown(ev) {
  ev.preventDefault();
  ev.stopPropagation();
  const uid = +ev.currentTarget.getAttribute('data-uid');
  const b = clientToBoard(ev);
  const p = photos.find(function (q) { return q.uid === uid; });
  // 记下原始状态，松手时用来做撤销
  dragPin = {
    uid: uid, bx0: b[0], by0: b[1], moved: false,
    lon0: p ? p.lon : 0, lat0: p ? p.lat : 0, city0: p ? p.city : '',
  };
  hidePopover();
  // 合成事件（测试里 dispatch 的 PointerEvent）没有活动指针，
  // setPointerCapture 会抛 InvalidPointerId；吞掉它，不影响拖动逻辑本身。
  try { ev.currentTarget.setPointerCapture && ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) { }
  board.addEventListener('pointermove', onPinMove);
  board.addEventListener('pointerup', onPinUp);
  board.addEventListener('pointercancel', onPinUp);
}

function onPinMove(ev) {
  if (!dragPin) return;
  const p = photos.find(function (q) { return q.uid === dragPin.uid; });
  if (!p) return;
  const b = clientToBoard(ev);
  // 2px 死区：手指按在针上必然有抖动。没有死区时，想点一下针看看，
  // 结果照片被挪出好几公里，而且完全没有提示。
  if (!dragPin.moved) {
    if (Math.abs(b[0] - dragPin.bx0) < 2 && Math.abs(b[1] - dragPin.by0) < 2) return;
    dragPin.moved = true;
    board.classList.add('pin-dragging');
  }
  const c = boardToCard(b[0], b[1]);
  const u = (c[0] - view.tx) / view.s;
  const v = (c[1] - view.ty) / view.s;
  const lat = clamp(Math.atan(Math.sinh(-v * D2R)) / D2R, scopeBox().lat0, scopeBox().lat1);
  const lon = clampLon(u);
  if (Math.abs(lat - p.lat) < 1e-6 && Math.abs(lon - p.lon) < 1e-6) return;
  p.lon = lon; p.lat = lat; p.locked = true;
  syncPins();
  drawYarn();
  // 拖动过程中就地改地名：松手前完全不知道自己在改什么是很糟的体验
  const nm = locateLabel(lon, lat);
  p.city = nm;
  if (p._labNode) p._labNode.textContent = nm;
  syncGranState();
}

function onPinUp() {
  board.removeEventListener('pointermove', onPinMove);
  board.removeEventListener('pointerup', onPinUp);
  board.removeEventListener('pointercancel', onPinUp);
  board.classList.remove('pin-dragging');
  const d = dragPin;
  dragPin = null;
  if (!d || !d.moved) return;          // 没动过 = 只是点了一下针，什么都不做
  const p = photos.find(function (q) { return q.uid === d.uid; });
  if (!p) return;
  p.city = locateLabel(p.lon, p.lat);
  if (p._labNode) p._labNode.textContent = p.city;
  p.cc = countryOf(p.lon, p.lat) || p.cc || '';
  // 用户亲手定过的位置不再是「猜的」：把待确认角标摘掉
  if (p._tagNode && p._tagNode.parentNode) p._tagNode.parentNode.removeChild(p._tagNode);
  p._tagNode = null;
  p.gps = true;
  patchPhotoRec(p);                    // 拖动后把新经纬度也存下来
  syncScheduleIndex(1200);

  // 撤销：手指拖针很容易拖偏，没有退路就只能再拖回去（往往更偏）
  const lon0 = d.lon0, lat0 = d.lat0, city0 = d.city0;
  showHint('已把这张挪到「' + p.city + '」。点我撤销', 9000);
  hintEl.classList.add('undo');
  hintUndo = function () {
    p.lon = lon0; p.lat = lat0; p.city = city0; p.gps = false;
    if (p._labNode) p._labNode.textContent = city0;
    syncPins(); drawYarn();
    patchPhotoRec(p);
    syncScheduleIndex(1200);
    if (!p.demo) renderPhotos();       // 角标要回来，得重画
    showHint('已撤销，这张回到原来的位置');
  };
}

/* --------------------------------------------------------- 拖动照片 --- */
/* 照片默认按走廊排布自动定位。拖动 = 换到另一个槽位，记成 p.rank（绕地图一圈的第几号位），
   而不是记坐标 —— 这样「其余照片自动让位」「换窗口/加照片后顺序不变」「红线始终不交叉」
   三件事同时成立。坐标法做不到第三点：钉到任意位置后，两根线必然可能相交。 */
let dragPhoto = null;

function photoTransform(p, cx, cy) {
  const d = p._dims;
  return 'translate(' + nf(cx) + ' ' + nf(cy) + ') rotate(' + p._rot.toFixed(2) +
         ') translate(' + (-d.pw / 2) + ' ' + (-d.ph / 2) + ')';
}

function onPhotoDown(ev, p) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  ev.stopPropagation();
  const ctm = layerPhotos.getScreenCTM();
  if (!ctm) return;
  const inv = ctm.inverse();
  const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(inv);
  dragPhoto = { p: p, x0: pt.x, y0: pt.y, cx0: p._cx, cy0: p._cy, moved: false, el: ev.currentTarget };
  p._skipClick = false;
  ev.currentTarget.classList.add('dragging');
  try { ev.currentTarget.setPointerCapture && ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) { }
}

/* 找离 (x,y) 最近的环形槽位。rank 是这个槽位在「绕卡片一圈」序列里的序号 ——
   拖到第几个槽位，就等于把这张照片排到第几位，其余照片自动让位。 */
function nearestRingSlot(x, y) {
  const ring = layoutInfo && layoutInfo.ring;
  if (!ring || !ring.length) return null;
  let best = null, bd = Infinity;
  for (let i = 0; i < ring.length; i++) {
    const dx = ring[i].ax - x, dy = ring[i].ay - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = { slot: ring[i], rank: i, dist: Math.sqrt(d) }; }
  }
  return best;
}

function showSlotHint(p, hit) {
  if (!slotHint) return;
  if (!hit) { slotHint.setAttribute('opacity', 0); return; }
  const d = p._dims, a2 = ROT_MAX * D2R, ca = Math.cos(a2), sa = Math.sin(a2);
  const bw = d.pw * ca + d.ph * sa, bh = d.pw * sa + d.ph * ca;
  const rot = angOf(p.uid) * D2R, ly = PIN_Y - d.ph / 2;
  const cx = hit.slot.ax + ly * Math.sin(rot), cy = hit.slot.ay - ly * Math.cos(rot);
  slotHint.setAttribute('x', nf(cx - bw / 2));
  slotHint.setAttribute('y', nf(cy - bh / 2));
  slotHint.setAttribute('width', nf(bw));
  slotHint.setAttribute('height', nf(bh));
  slotHint.setAttribute('opacity', 0.9);
}

function onPhotoMove(ev) {
  if (!dragPhoto) return;
  const el0 = dragPhoto.el;
  const ctm = layerPhotos.getScreenCTM();
  if (!ctm) return;
  const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(ctm.inverse());
  let nx = dragPhoto.cx0 + (pt.x - dragPhoto.x0);
  let ny = dragPhoto.cy0 + (pt.y - dragPhoto.y0);
  if (!dragPhoto.moved) {
    if (Math.abs(pt.x - dragPhoto.x0) < 2 && Math.abs(pt.y - dragPhoto.y0) < 2) return;
    dragPhoto.moved = true;
  }
  const p = dragPhoto.p, d = p._dims;
  // 出画布就夹住（留半个拍立得的余量）
  const hw = (d.pw + d.ph) / 3, hh = hw;
  nx = clamp(nx, hw, BW - hw);
  ny = clamp(ny, hh, BH - hh);
  p._cx = nx; p._cy = ny;
  el0.setAttribute('transform', photoTransform(p, nx, ny));
  // 照片自己的针跟着照片走 → 重算后只更新这一条线
  const a2 = p._rot * D2R, c2 = Math.cos(a2), s2 = Math.sin(a2);
  const lx = 0, ly = 9 - d.ph / 2;
  p._pinBoard = [nx + lx * c2 - ly * s2, ny + lx * s2 + ly * c2];
  updateYarnFor(p);
  // 拖动时用虚框标出「松手会落到哪个槽位」
  dragPhoto.hit = nearestRingSlot(p._pinBoard[0], p._pinBoard[1]);
  showSlotHint(p, dragPhoto.hit);
}

function onPhotoUp(ev) {
  if (!dragPhoto) return;
  const p = dragPhoto.p, hit = dragPhoto.hit, moved = dragPhoto.moved;
  dragPhoto.el.classList.remove('dragging');
  dragPhoto = null;
  if (slotHint) slotHint.setAttribute('opacity', 0);
  if (!moved) return;                       // 没挪动 → 交给 click 去开大图
  p._skipClick = true;
  if (hit) {
    /* 手指落在哪一位，就记哪一位 —— 不做"就近另找零交叉位次"的自动改判。
       理由：改判会让照片落在用户没指的地方，比多两根交叉线更让人困惑。
       位次冲突导致连线交叉时，提示里说清根数，并留一条「自动排位」的退路。 */
    const want = hit.rank;
    p.rank = want;
    patchPhotoRec(p);
    syncScheduleIndex(1200);
    renderPhotos();
    const xw = (layoutInfo && layoutInfo.x) || 0;
    showHint('已排到第 ' + (want + 1) + ' 位（绕地图一圈数）'
      + (hit.shifted ? '，再往前会让红线交叉，就落在了最近的不交叉位置' : '')
      + (xw ? '。这个顺序有 ' + xw + ' 根线难免交叉 —— 点开这张看大图可以「自动排位」' : '')
      + '。想恢复自动排位：点开这张看大图 → 「自动排位」。', 7000);
  } else {
    renderPhotos();                         // 一个槽位都没有（单张照片）：弹回原位
  }
  syncPopReset();
}

/* 地图平移 + 滚轮缩放 */
let panState = null;
function bindMapInteractions() {
  let surface = el('rect', {
    id: 'mapSurface', x: 0, y: 0, width: CARD.w, height: CARD.h,
    fill: 'transparent'
  }, layerCard);
  // 挪到大头针下面：能接住空白处的拖拽/滚轮，又不挡住针
  layerCard.insertBefore(surface, layerPins);

  surface.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0) return;
    hidePopover();
    const b = clientToBoard(ev);
    panState = { x: b[0], y: b[1], tx: view.tx, ty: view.ty };
    surface.classList.add('panning');
    surface.setPointerCapture && surface.setPointerCapture(ev.pointerId);
    surface.addEventListener('pointermove', onPanMove);
    surface.addEventListener('pointerup', onPanUp);
    surface.addEventListener('pointercancel', onPanUp);
  });

  surface.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    const b = clientToBoard(ev);
    const c = boardToCard(b[0], b[1]);
    const f = Math.exp(-ev.deltaY * 0.0016);
    zoomAt(c[0], c[1], f);
  }, { passive: false });

  surface.addEventListener('dblclick', function () { resetView(true); });

  /* ---- 双指捏合缩放：手机上唯一可用的缩放手势（滚轮不存在） ---- */
  const ptrs = new Map();
  let pinchD0 = 0, pinchS0 = 0;
  const stageEl = document.getElementById('stage');
  function ptrDist() {
    const a = Array.from(ptrs.values());
    return Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
  }
  function ptrMid() {
    const a = Array.from(ptrs.values());
    return { clientX: (a[0][0] + a[1][0]) / 2, clientY: (a[0][1] + a[1][1]) / 2 };
  }
  stageEl.addEventListener('pointerdown', function (ev) {
    ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (ptrs.size === 2) { panState = null; pinchD0 = ptrDist(); pinchS0 = view.s; }
  });
  stageEl.addEventListener('pointermove', function (ev) {
    if (!ptrs.has(ev.pointerId)) return;
    ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (ptrs.size !== 2 || !(pinchD0 > 0)) return;
    const d = ptrDist();
    if (!(d > 0)) return;
    const want = pinchS0 * d / pinchD0;          // 手势目标缩放
    const f = want / view.s;
    if (!isFinite(f) || f <= 0) return;
    const b = clientToBoard(ptrMid());
    const c = boardToCard(b[0], b[1]);
    zoomAt(c[0], c[1], f);
  });
  const endPtr = function (ev) {
    ptrs.delete(ev.pointerId);
    if (ptrs.size < 2) pinchD0 = 0;
  };
  stageEl.addEventListener('pointerup', endPtr);
  stageEl.addEventListener('pointercancel', endPtr);
  stageEl.addEventListener('pointerleave', endPtr);
}

function onPanMove(ev) {
  if (!panState) return;
  const b = clientToBoard(ev);
  view.tx = panState.tx + (b[0] - panState.x);
  view.ty = panState.ty + (b[1] - panState.y);
  applyView();
}
function onPanUp(ev) {
  panState = null;
  const s = ev.currentTarget;
  if (s) { s.classList.remove('panning'); s.removeEventListener('pointermove', onPanMove);
           s.removeEventListener('pointerup', onPanUp); s.removeEventListener('pointercancel', onPanUp); }
}

function zoomAt(px, py, factor) {
  const s0 = view.s;
  const s1 = clamp(s0 * factor, baseView.s * 0.8, baseView.s * 11);
  if (Math.abs(s1 - s0) < 1e-9) return;
  const k = s1 / s0;
  view.tx = px - (px - view.tx) * k;
  view.ty = py - (py - view.ty) * k;
  view.s = s1;
  if (tweenToken) { cancelAnimationFrame(tweenToken); tweenToken = null; }
  applyView();
}

/* --------------------------------------------------------- 照片预览 --- */
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const popCity = document.getElementById('popCity');
CITIES.forEach(function (c) {
  const o = document.createElement('option'); o.value = c[0]; o.textContent = c[0]; popCity.appendChild(o);
});
let popUid = 0;

/* 当前地点若不在城市表里（EXIF 定位到县/省），临时插一个选项，避免下拉显示空白 */
function ensureCityOption(name) {
  if (!name) return;
  if (Array.prototype.some.call(popCity.options, function (o) { return o.value === name; })) return;
  const o = document.createElement('option');
  o.value = name; o.textContent = name; o.dataset.extra = '1';
  popCity.insertBefore(o, popCity.firstChild);
}

function fitViewerImg() {
  const nw = viewerImg.naturalWidth, nh = viewerImg.naturalHeight;
  if (!nw || !nh) return;
  // 与 CSS 的上限对齐，再扣掉拍立得白边（左右 12+12、上 12、下 46）
  const capW = Math.min(innerWidth * 0.86, 1400) - 24;
  const capH = (innerHeight - 150) - 58;
  const k = Math.min(capW / nw, capH / nh);
  viewerImg.style.width = Math.round(nw * k) + 'px';
  viewerImg.style.height = Math.round(nh * k) + 'px';
}

/* 「自动排位」只在这张照片被手动排过序时可用 */
function syncPopReset() {
  const btn = document.getElementById('popReset');
  const p = photos.find(function (q) { return q.uid === popUid; });
  btn.hidden = !(p && p.rank != null);
}

function openViewer(uid) {
  const p = photos.find(function (q) { return q.uid === uid; });
  if (!p) return;
  popUid = uid;
  viewerImg.style.width = ''; viewerImg.style.height = '';
  viewerImg.src = p.url;
  ensureCityOption(p.city);
  popCity.value = p.city;
  viewer.classList.add('on');
  syncPopReset();
  if (viewerImg.complete) fitViewerImg();
  else viewerImg.onload = fitViewerImg;
}
function hideViewer() { viewer.classList.remove('on'); popUid = 0; }
/* 兼容旧调用点（导出 / 平移前收起预览） */
function hidePopover() { hideViewer(); }

viewer.addEventListener('click', function (ev) {
  if (ev.target === viewer) hideViewer();
});
document.getElementById('viewerClose').addEventListener('click', hideViewer);
popCity.addEventListener('change', function () {
  const p = photos.find(function (q) { return q.uid === popUid; });
  if (!p) return;
  p.city = popCity.value;
  const c = CITY_INDEX[p.city];
  if (c) { p.lon = c.lon; p.lat = c.lat; }
  p.locked = true;
  p.gps = true;                 // 用户亲手选的地点 = 已确认，不再算「猜的」
  patchPhotoRec(p);
  renderPhotos();
  syncGranState();
  syncScheduleIndex(600);
});
document.getElementById('popReset').addEventListener('click', function () {
  const p = photos.find(function (q) { return q.uid === popUid; });
  if (!p) return;
  p.rank = null;
  patchPhotoRec(p);
  renderPhotos();
  syncPopReset();
  showHint('这张已经回到自动排位。', 3000);
});
document.getElementById('popDel').addEventListener('click', function () {
  const uid = popUid;
  hideViewer();
  const gone = photos.find(function (q) { return q.uid === uid; });
  dropPhotoRec(uid);
  photos = photos.filter(function (q) { return q.uid !== uid; });
  if (gone) syncDeleteOne(gone);          // 云端也删掉，否则下次拉取会把它复活
  if (!photos.length) {
    // 删到空墙不偷偷塞回示例：那样用户会以为自己没删掉。
    // 空墙就是空墙，给一句怎么继续。
    renderPhotos();
    resetView(true);
    syncGranState();
    showHint('这面墙空了。点「加照片」放一张进来。', 6000);
  } else {
    renderPhotos(); fitToPins(true); syncGranState();
    syncScheduleIndex(400);
  }
});
window.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') hideViewer();
});

/* --------------------------------------------------------- 照片增删改 --- */
function nextCity() {
  const used = new Set(photos.map(function (p) { return p.city; }));
  for (let i = 0; i < SPREAD.length; i++) if (!used.has(SPREAD[i])) return SPREAD[i];
  for (let i = 0; i < CITIES.length; i++) if (!used.has(CITIES[i][0])) return CITIES[i][0];
  return CITIES[Math.floor(rnd() * CITIES.length)][0];
}

function makePhoto(city) {
  const c = CITY_INDEX[city] || CITIES[0];
  return {
    uid: uidSeq++,
    cid: newCid(),           // 云端这条记录的稳定 id（跨设备合并靠它）
    ts: Date.now(),
    url: null, w: 1, h: 1,
    city: city,
    lon: c.lon, lat: c.lat,
    cc: '中国',
    rank: null,              // 拖过就是「绕地图一圈的第几号位」，null = 自动排
    locked: false
  };
}

function useDemo() {
  photos = [];
  DEMO_DATA.forEach(function (d) {
    photos.push({
      uid: uidSeq++,
      url: d.uri, w: d.w, h: d.h,
      lon: d.lon, lat: d.lat,
      city: locateLabel(d.lon, d.lat),
    cc: countryOf(d.lon, d.lat) || '',
      locked: false, demo: true
    });
  });
  // 示例照片全在国内 → 范围回到「中国」，别停在上一次的全球档
  if (scope !== 'cn') setScope('cn', false);
  renderPhotos();
  resetView(true);
  syncGranState();
}

/* 认出 iPhone 的 HEIC/HEIF：靠 ftyp 盒的 brand，不靠扩展名（微信下载常常没扩展名）。
   这一步只用来把提示说准 —— 别把一张坏 JPEG 也说成"HEIC 格式"。 */
function isHeicFile(file) {
  return new Promise(function (res) {
    try {
      const fr = new FileReader();
      fr.onload = function () {
        const b = new Uint8Array(fr.result || []);
        if (b.length < 12) return res(false);
        const box = String.fromCharCode(b[4], b[5], b[6], b[7]);
        const brand = String.fromCharCode(b[8], b[9], b[10], b[11]);
        res(box === 'ftyp' && /^(heic|heix|hevc|hevx|heim|heis|mif1|msf1)$/.test(brand));
      };
      fr.onerror = function () { res(false); };
      fr.readAsArrayBuffer(file.slice(0, 32));
    } catch (e) { res(false); }
  });
}

/* HEIC/HEIF → JPEG：只在"这个浏览器自己能解 HEIF"时才成功（目前是 Safari / iOS）。
   做法是把文件塞给 <img>：能解码就画到 canvas 取 JPEG，用户完全无感；
   Chrome / Firefox 走不通，返回 null，由上层给出"换格式"的说明。 */
function heicToJpeg(file) {
  return new Promise(function (res) {
    let u = null;
    try { u = URL.createObjectURL(file); } catch (e) { res(null); return; }
    const im = new Image();
    let done = false;
    const fin = function (v) {
      if (done) return;
      done = true;
      try { URL.revokeObjectURL(u); } catch (e) {}
      res(v);
    };
    im.onload = function () {
      try {
        if (!im.naturalWidth) return fin(null);
        const W = Math.min(im.naturalWidth, 1600);
        const H = Math.max(1, Math.round(im.naturalHeight * W / im.naturalWidth));
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const cx = c.getContext('2d');
        cx.drawImage(im, 0, 0, W, H);
        fin({ url: c.toDataURL('image/jpeg', 0.86), w: W, h: H });
      } catch (e) { fin(null); }
    };
    im.onerror = function () { fin(null); };
    im.src = u;
  });
}

function readAsDataURL(file) {
  return new Promise(function (res, rej) {
    const fr = new FileReader();
    fr.onload = function () { res(fr.result); };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function loadSize(url) {
  return new Promise(function (res) {
    const img = new Image();
    img.onload = function () { res({ w: img.naturalWidth || 4, h: img.naturalHeight || 5 }); };
    img.onerror = function () { res({ w: 0, h: 0 }); };   // 0 = 浏览器解码不了（HEIC 等）
    img.src = url;
  });
}

/* ------------------------------------------------- 本地持久化（IndexedDB） --- */
/* 刷新不丢：原图 Blob + 经纬度 + 地点名存在浏览器本地，下次打开自动复原同一面墙。
   数据只在用户自己的浏览器里，不上传。存 Blob 而不是 base64（省 1/3 体积），
   复原时再读成 dataURL —— 这样导出的序列化链路和「刚上传」时完全一致。 */
const DB_NAME = 'photo-map-wall', DB_VER = 1, STORE = 'photos';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function (res) {
    let rq;
    try { rq = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return res(null); }
    rq.onupgradeneeded = function () {
      const db = rq.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'uid' });
    };
    rq.onsuccess = function () { res(rq.result); };
    rq.onerror = function () { res(null); };
    rq.onblocked = function () { res(null); };
  });
  return dbPromise;
}

/* 统一的读写包装：任何一步出问题都返回 null，绝不让存储问题把页面搞崩 */
function idbRun(mode, fn) {
  return openDB().then(function (db) {
    if (!db) return null;
    return new Promise(function (res) {
      let tx;
      try { tx = db.transaction(STORE, mode); } catch (e) { return res(null); }
      let out = null;
      try { out = fn(tx.objectStore(STORE)); } catch (e) { return res(null); }
      tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
      tx.onerror = function () { res(null); };
      tx.onabort = function () { res(null); };
    });
  });
}

/* 存一张：blob 是原始 File，fileName 只用于「导出时看不出区别」的元信息 */
function savePhotoRec(p, file) {
  if (!file) return Promise.resolve(null);
  return idbRun('readwrite', function (st) {
    return st.put({
      uid: p.uid, cid: p.cid || '', blob: file, w: p.w, h: p.h,
      lon: p.lon, lat: p.lat, city: p.city,
      cc: p.cc || '',
      gps: !!p.gps, ts: p.ts || Date.now(),
      rank: p.rank == null ? null : p.rank,
    });
  }).catch(function () { return null; });
}

/* 只改元信息（拖针、改城市之后调用）：读回来改字段再写，避免重复存 Blob */
function patchPhotoRec(p) {
  if (p.demo) return Promise.resolve(null);
  return openDB().then(function (db) {
    if (!db) return null;
    return new Promise(function (res) {
      let tx;
      try { tx = db.transaction(STORE, 'readwrite'); } catch (e) { return res(null); }
      const st = tx.objectStore(STORE);
      const g = st.get(p.uid);
      g.onsuccess = function () {
        const rec = g.result;
        if (!rec) return;
        rec.lon = p.lon; rec.lat = p.lat; rec.city = p.city; rec.gps = !!p.gps;
        rec.cc = p.cc || '';
        rec.rank = p.rank == null ? null : p.rank;
        if (p.cid) rec.cid = p.cid;
        try { st.put(rec); } catch (e) { }
      };
      tx.oncomplete = function () { res(1); };
      tx.onerror = function () { res(null); };
      tx.onabort = function () { res(null); };
    });
  }).catch(function () { return null; });
}

function dropPhotoRec(uid) {
  return idbRun('readwrite', function (st) { return st.delete(uid); });
}

function clearRecs() {
  return idbRun('readwrite', function (st) { return st.clear(); });
}

function memToDataURL(blob) {
  return new Promise(function (res, rej) {
    const fr = new FileReader();
    fr.onload = function () { res(fr.result); };
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

/* 打开页面时把上次的墙复原出来；没有记录就什么都不做（继续放示例） */
async function restoreFromDB() {
  const recs = await idbRun('readonly', function (st) { return st.getAll(); });
  if (!recs || !recs.length) return 0;
  recs.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
  const out = [];
  for (let i = 0; i < recs.length && out.length < 40; i++) {
    const r = recs[i];
    let url = null;
    try { url = await memToDataURL(r.blob); } catch (e) { url = null; }
    if (!url) continue;                       // 记录坏了就跳过，不阻塞其余
    out.push({
      uid: uidSeq++, cid: r.cid || newCid(), url: url,
      w: r.w || 4, h: r.h || 5,
      lon: r.lon, lat: r.lat, city: r.city,
      gps: !!r.gps, locked: true, ts: r.ts || Date.now(),
      rank: typeof r.rank === 'number' ? r.rank : null,
    });
  }
  if (!out.length) return 0;
  photos = out;
  // 恢复出来的照片有出国的 → 地图范围也得跟着切，否则针会被裁到国境线上
  if (scope !== 'world' && out.some(function (p) { return !inChina(p.lon, p.lat); })) {
    setScope('world', false);
  }
  renderPhotos();
  resetView(true);
  syncGranState();
  return out.length;
}

/* ======================================== 云端「同一面墙」（跨设备接续） ===
   要解决的问题：手机刷新、退出重进、Wi-Fi 换流量，照片就没了；换台设备更是从零开始。
   用户提的「用 IP 或者设备认人」，IP 那条必须否掉：
     - 手机在流量和 Wi-Fi 之间切换，出口 IP 就变了；
     - 同一个基站/公司出口下，好几个人共用一个 IP（CGNAT），用 IP 会把不同人混成一面墙。
   所以身份 = 客户端自己生成的 128 位随机 key，双写 localStorage + cookie（两者清一个还有一个）。
   它跟着**设备**走，不跟网络走 → 换 Wi-Fi、切流量都不掉线到别的墙。
   key 太长记不住 → 服务端发一个 12 位「同步码」（XXXX-XXXX-XXXX），换设备输入它即可接回。

   存储落在同源的 /api/wall（Cloudflare Pages Function + KV），所以没有跨域问题。
   在 file:// 打开时没有这个能力，自动降级成「只在本机」，不报错、不弹窗。

   降级原则：任何一步失败都不许把页面搞坏，只在同步面板里写一句人话。
======================================================================= */
const SYNC_API = '/api/wall';
const WALL_KEY_LS = 'pmw.wallKey';
const WALL_KEY_CK = 'pmw_key';
let wallKey = '';
let syncState = 'off';        // off=不可用 / local=只在本机 / ok=已同步 / err=连不上
let syncCode = '';
let syncRemoteCount = 0;
let syncQueue = Promise.resolve();
let syncIndexTimer = null;

function newCid() {
  const b = new Uint8Array(8);
  (self.crypto || self.msCrypto).getRandomValues(b);
  let s = '';
  for (let i = 0; i < 8; i++) s += b[i].toString(16).padStart(2, '0');
  return s;
}

function readCookie(n) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}
function writeCookie(n, v, days) {
  try {
    const sec = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = n + '=' + encodeURIComponent(v) + '; path=/; max-age=' + (days * 86400)
      + '; SameSite=Lax' + sec;
  } catch (e) { /* 无痕/禁用 cookie：忽略，localStorage 还有一份 */ }
}

function initWallKey() {
  let k = '';
  try { k = localStorage.getItem(WALL_KEY_LS) || ''; } catch (e) { k = ''; }
  if (!/^[a-f0-9]{32}$/.test(k)) k = readCookie(WALL_KEY_CK);
  if (!/^[a-f0-9]{32}$/.test(k)) k = newCid() + newCid();
  wallKey = k;
  try { localStorage.setItem(WALL_KEY_LS, k); } catch (e) { /* 忽略 */ }
  writeCookie(WALL_KEY_CK, k, 365);
}

function setWallKey(k) {
  if (!/^[a-f0-9]{32}$/.test(k)) return false;
  wallKey = k;
  syncCode = '';
  try { localStorage.setItem(WALL_KEY_LS, k); } catch (e) { /* 忽略 */ }
  writeCookie(WALL_KEY_CK, k, 365);
  return true;
}

/* file:// 与 http 页面之外的场景没有同源后端，直接降级 */
function syncAllowed() {
  return (location.protocol === 'https:' || location.protocol === 'http:') && !!wallKey;
}

async function syncCall(path, opt, ms) {
  const ac = new AbortController();
  const timer = setTimeout(function () { ac.abort(); }, ms || 15000);
  const o = Object.assign({}, opt || {});
  o.signal = ac.signal;
  o.headers = Object.assign({ 'x-wall-key': wallKey }, o.headers || {});
  try { return await fetch(SYNC_API + path, o); }
  finally { clearTimeout(timer); }
}

/* 同步状态 → 工具条上的小圆点 + 面板里那句话。
   绝不弹 alert：同步是后台能力，失败不该打断用户。 */
function markSync(st, note) {
  syncState = st;
  const btn = document.getElementById('btnSync');
  if (btn) btn.setAttribute('data-sync', st === 'err' ? 'off' : st);
  const st0 = document.getElementById('syncStat');
  if (!st0) return;
  if (note) { st0.innerHTML = note; return; }
  if (st === 'off') {
    st0.innerHTML = '这台设备上打不开云端（用 <b>file://</b> 直接双击打开时没有后端）。'
      + '<br><span class="warn">照片只存在这台设备的浏览器里。</span>';
  } else if (st === 'local') {
    st0.innerHTML = '正在检查云端…';
  } else if (st === 'ok') {
    st0.innerHTML = '云端已有 <b>' + syncRemoteCount + '</b> 张；这台设备显示 <b>'
      + photos.filter(function (p) { return !p.demo; }).length + '</b> 张。';
  } else {
    st0.innerHTML = '<span class="warn">连不上云端，照片已经存在这台设备上，恢复网络后会自动补传。</span>';
  }
}

/* 云端只存"中等尺寸"版本：长边 1600、JPEG 0.8（约 200~400 KB）。
   原图留在本机 IndexedDB 和 NAS 归档里 —— Cloudflare KV 免费额度只有 1 GB 存储、
   每天 1000 次写，一张 8 MB 的原图能吃掉半面墙的额度。
   本机上仍然用原图（导出、预览都按原图渲染），只有上传那一份是压过的。 */
const CLOUD_MAX_SIDE = 1600;
const CLOUD_Q = 0.8;
function shrinkForCloud(p) {
  return new Promise(function (res) {
    if (!p.url || p.demo) return res(null);
    const im = new Image();
    im.onload = function () {
      try {
        const nw = im.naturalWidth, nh = im.naturalHeight;
        if (!nw || !nh) return res(null);
        const k = Math.min(1, CLOUD_MAX_SIDE / Math.max(nw, nh));
        const W = Math.max(1, Math.round(nw * k));
        const H = Math.max(1, Math.round(nh * k));
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const cx = c.getContext('2d');
        cx.imageSmoothingEnabled = true;
        cx.imageSmoothingQuality = 'high';
        cx.drawImage(im, 0, 0, W, H);
        c.toBlob(function (b) { res(b); }, 'image/jpeg', CLOUD_Q);
      } catch (e) { res(null); }
    };
    im.onerror = function () { res(null); };
    im.src = p.url;
  });
}

/* 单张原图上传。file 优先用原始 File（省一次转码），恢复出来的照片用 dataURL 转 Blob */
async function photoBlob(p) {
  if (p._file) return p._file;
  if (!p.url) return null;
  try { const r = await fetch(p.url); return await r.blob(); } catch (e) { return null; }
}

async function syncPutPhoto(p) {
  if (!syncAllowed() || p.demo || !p.cid) return false;
  // 先压到云端版本；压不出来（画布被禁用等）才退回原图
  const blob = (await shrinkForCloud(p)) || (await photoBlob(p));
  if (!blob) return false;
  if (blob.size > 8 * 1024 * 1024) return false;      // 服务端上限 8 MB
  const r = await syncCall('/blob?id=' + encodeURIComponent(p.cid)
    + '&n=' + encodeURIComponent(p._name || (p.cid + '.jpg')),
    { method: 'PUT', body: blob, headers: { 'content-type': blob.type || 'image/jpeg' } }, 60000);
  if (!r.ok) { markSync('err'); return false; }
  return true;
}

/* 清单整体覆盖（服务端不维护计数器，避免读-改-写竞态） */
function syncScheduleIndex(delay) {
  if (syncIndexTimer) clearTimeout(syncIndexTimer);
  syncIndexTimer = setTimeout(function () {
    syncIndexTimer = null;
    syncQueue = syncQueue.then(syncPushIndex, syncPushIndex);
  }, delay == null ? 900 : delay);
}

async function syncPushIndex() {
  if (!syncAllowed()) { markSync('off'); return false; }
  const real = photos.filter(function (p) { return !p.demo; });
  const list = real.slice(0, 80).map(function (p) {
    return {
      id: p.cid, name: p._name || '', bytes: p._bytes || 0,
      w: p.w, h: p.h, lon: p.lon, lat: p.lat, city: p.city,
      cc: p.cc || '',       ts: p.ts || Date.now(), rank: p.rank == null ? null : p.rank, t: 'image/jpeg',
    };
  });
  try {
    const r = await syncCall('/index', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ photos: list }),
    }, 20000);
    if (!r.ok) { markSync('err'); return false; }
    const o = await r.json();
    if (o && o.code) syncCode = o.code;
    syncRemoteCount = list.length;
    markSync('ok');
    renderSyncCode();
    return true;
  } catch (e) {
    markSync('err');
    return false;
  }
}

/* 串行队列：一批照片按顺序传，失败重试一次。
   不用 Promise.all —— 手机上行带宽有限，并发 8 张只会互相拖慢。 */
function syncQueuePhotos(list) {
  if (!syncAllowed() || !list.length) return;
  const btn = document.getElementById('btnSync');
  if (btn) btn.classList.add('uploading');
  list.forEach(function (p) {
    syncQueue = syncQueue.then(async function () {
      let ok = await syncPutPhoto(p).catch(function () { return false; });
      if (!ok) { await new Promise(function (r) { setTimeout(r, 1200); }); ok = await syncPutPhoto(p).catch(function () { return false; }); }
      return ok;
    }, function () { return false; });
  });
  syncQueue = syncQueue.then(function () {
    if (btn) btn.classList.remove('uploading');
    return syncPushIndex();
  }, function () {
    if (btn) btn.classList.remove('uploading');
    return null;
  });
}

/* 从云端把「这台设备上没有」的照片拉回来 —— 换设备/清了缓存后靠这一步复活 */
async function syncPull() {
  if (!syncAllowed()) { markSync('off'); return 0; }
  let o = null;
  try {
    const r = await syncCall('/index', { method: 'GET' }, 12000);
    if (!r.ok) { markSync('err'); return 0; }
    o = await r.json();
  } catch (e) { markSync('err'); return 0; }
  if (!o) return 0;
  if (o.code) { syncCode = o.code; renderSyncCode(); }
  const remote = (o.photos || []).filter(function (x) {
    return x && x.id && isFinite(x.lon) && isFinite(x.lat);
  });
  syncRemoteCount = remote.length;
  if (!remote.length) { markSync('ok'); return 0; }

  const have = {};
  photos.forEach(function (p) { if (!p.demo && p.cid) have[p.cid] = 1; });
  const out = [];
  for (let i = 0; i < remote.length; i++) {
    const rec = remote[i];
    if (have[rec.id]) continue;
    if (photos.length + out.length >= 40) break;
    let url = null;
    try {
      const br = await syncCall('/blob?id=' + encodeURIComponent(rec.id), { method: 'GET' }, 30000);
      if (!br.ok) continue;
      url = await memToDataURL(await br.blob());
    } catch (e) { continue; }
    if (!url) continue;
    out.push({
      uid: uidSeq++, cid: rec.id, url: url,
      w: rec.w || 4, h: rec.h || 5, lon: rec.lon, lat: rec.lat,
      city: rec.city || locateLabel(rec.lon, rec.lat),
      cc: rec.cc || countryOf(rec.lon, rec.lat) || '',
      gps: true, locked: true, ts: rec.ts || Date.now(),
      rank: typeof rec.rank === 'number' ? rec.rank : null,
    });
  }
  if (out.length) {
    // 屏幕上还是示例 → 让位给真实照片
    if (photos.length && photos.every(function (p) { return p.demo; })) photos = [];
    photos = photos.concat(out);
    if (scope !== 'world' && photos.some(function (p) { return !inChina(p.lon, p.lat); })) setScope('world', false);
    renderPhotos();
    resetView(true);
    syncGranState();
  }
  markSync('ok');
  return out.length;
}

async function syncDeleteOne(p) {
  if (!syncAllowed() || !p.cid) { syncScheduleIndex(); return; }
  try { await syncCall('/blob?id=' + encodeURIComponent(p.cid), { method: 'DELETE' }, 12000); } catch (e) { /* 清单会兜住 */ }
  syncScheduleIndex(200);
}

async function syncWipe() {
  if (!syncAllowed()) return { ok: false };
  try {
    const r = await syncCall('/index', { method: 'DELETE' }, 20000);
    if (!r.ok) return { ok: false };
    return await r.json();
  } catch (e) { return { ok: false }; }
}

/* 用同步码接回另一面墙：先把本机现有照片补传上去，再合并云端清单。
   —— 只 pull 不 push 的话，本机这些照片会从清单里被挤掉。 */
async function syncJoin(rawCode) {
  const code = String(rawCode || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 12) return { ok: false, why: '格式' };
  let key = '';
  try {
    const r = await fetch(SYNC_API + '/pair', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code: code }),
    });
    if (r.status === 404) return { ok: false, why: '没有这个码' };
    if (!r.ok) return { ok: false, why: '网络' };
    const o = await r.json();
    key = o.key || '';
  } catch (e) { return { ok: false, why: '网络' }; }
  if (!/^[a-f0-9]{32}$/.test(key)) return { ok: false, why: '网络' };

  setWallKey(key);
  // 1) 本机现有真实照片补传（空设备时这一步是空转）
  const real = photos.filter(function (p) { return !p.demo; });
  for (let i = 0; i < real.length; i++) await syncPutPhoto(real[i]).catch(function () { return false; });
  // 2) 云端清单 + 本机 = 合并后整体写回（不能用本机覆盖，否则会把对方照片挤掉）
  let remote = [];
  try {
    const r2 = await syncCall('/index', { method: 'GET' }, 12000);
    if (r2.ok) { const o2 = await r2.json(); remote = (o2.photos || []); }
  } catch (e) { /* 拿不到就只用本机，仍会写回 */ }
  const seen = {};
  const merged = [];
  remote.concat(real.map(function (p) {
    return { id: p.cid, name: p._name || '', bytes: p._bytes || 0, w: p.w, h: p.h,
             lon: p.lon, lat: p.lat, city: p.city, ts: p.ts || Date.now(), t: 'image/jpeg' };
  })).forEach(function (x) {
    if (!x || !x.id || seen[x.id]) return;
    seen[x.id] = 1; merged.push(x);
  });
  try {
    await syncCall('/index', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ photos: merged.slice(0, 80) }),
    }, 20000);
  } catch (e) { /* 忽略，下面 pull 会再试 */ }
  syncCode = '';
  const added = await syncPull();
  return { ok: true, added: added, total: merged.length };
}

/* -------------------------------------------------- 同步面板 UI --- */
function renderSyncCode() {
  const tx = document.getElementById('syncCodeText');
  const cp = document.getElementById('btnCopyCode');
  const wp = document.getElementById('btnWipe');
  if (!tx) return;
  if (syncCode) {
    tx.textContent = syncCode;
    tx.classList.remove('waiting');
    if (cp) cp.disabled = false;
    if (wp) wp.disabled = false;
  } else {
    tx.textContent = syncState === 'off' ? '仅本机可用' : '正在取…';
    tx.classList.add('waiting');
    if (cp) cp.disabled = true;
    if (wp) wp.disabled = true;
  }
}

    if (r.ok) { syncCode = ''; syncRemoteCount = 0; renderSyncCode(); markSync('ok'); }
  });
